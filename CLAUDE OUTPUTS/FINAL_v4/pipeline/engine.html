<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math remix</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16}
  body.render canvas{height:auto;width:1080px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*KIT*/
/* ===== Math remix engine: one config -> one Reel. All text stays in y 200..1440 (top 75 % of frame). ===== */
const CFG=/*CFG*/;
const P=CFG.pal, Z=CFG.zoom||1, EMO='"Noto Color Emoji"';
const YMAX=1440;
function cap(s,y,a,o={}){text(s,540,Math.min(y,YMAX-40),{size:56,weight:700,maxW:920,lh:1.18,alpha:a,color:P.txt,...o});}
function chip(s,x,y,col,a,o={}){if(a<=0)return;const size=o.size||48;setFont(size,o.weight||700);const w=ctx.measureText(s).width+size*1.1,h=size*1.75;
  ctx.save();ctx.globalAlpha*=a;rrect(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=rgba(col,o.fill??.16);ctx.fill();ctx.strokeStyle=rgba(col,.95);ctx.lineWidth=4;ctx.stroke();ctx.restore();
  text(s,x,y+2,{size,weight:o.weight||700,color:o.color||P.txt,alpha:a});}
const fmtNum=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2);
function zoomed(cy,fn){ctx.save();ctx.translate(540,cy);ctx.scale(Z,Z);ctx.translate(-540,-cy);fn();ctx.restore();}
function gradText(s,x,y,size,c1,c2,a=1,glow=40){if(a<=0)return;ctx.save();setFont(size,800);const w=ctx.measureText(s).width;
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.globalAlpha*=a;ctx.fillStyle=g;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=c2;ctx.shadowBlur=glow;ctx.fillText(s,x,y);ctx.restore();}

/* ---------- backgrounds ---------- */
const PT=[];{const r=rng(CFG.seed||7);for(let i=0;i<240;i++)PT.push({x:r()*W,y:r()*H,z:.3+r()*.7,ph:r()*6.28,d:Math.floor(r()*10)});}
function bg(t){
  const g=ctx.createRadialGradient(540,H*.42,40,540,H*.42,H*.9);g.addColorStop(0,P.bg1);g.addColorStop(1,P.bg0);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const k=CFG.bg;
  if(k==='dust'){for(const p of PT){const y=((p.y-t*16*p.z)%H+H)%H,x=p.x+Math.sin(t*.3+p.ph)*12;
      ctx.fillStyle=rgba(P.dim,.10+.28*p.z*(.6+.4*Math.sin(t*1.3+p.ph)));ctx.fillRect(x,y,1.2+2*p.z,1.2+2*p.z);}}
  else if(k==='grid'){ctx.strokeStyle=rgba(P.dim,.10);ctx.lineWidth=1.5;const o=(t*10)%90;
      for(let x=-90+o;x<W+90;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=-90+o*.5;y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
  else if(k==='rain'){setFont(26,500,MONO);ctx.textAlign='center';ctx.textBaseline='middle';
      for(let c=0;c<18;c++){const sp=40+hash(c*3.1)*60,off=hash(c*7.7)*H;
        for(let r=0;r<22;r++){const y=((r*92+t*sp+off)%(H+100))-50,v=Math.floor(hash(c*31+r*7+Math.floor(t*3+hash(c+r)*3))*10);
          ctx.fillStyle=rgba(P.a,.05+.10*hash(c*5+r));ctx.fillText(String(v),30+c*60,y);}}}
  else if(k==='rings'){ctx.lineWidth=2;for(let i=0;i<9;i++){const r=((i*130+t*40)%1170);ctx.strokeStyle=rgba(P.b,.10*(1-r/1170));
      ctx.beginPath();ctx.arc(540,880,r,0,7);ctx.stroke();}
      for(const p of PT.slice(0,90)){ctx.fillStyle=rgba(P.dim,.15*p.z);ctx.fillRect(p.x,(p.y+t*6*p.z)%H,2,2);}}
  else if(k==='lines'){ctx.lineWidth=1.5;for(let i=0;i<14;i++){const y0=hash(i*9.3)*H;ctx.strokeStyle=rgba(i%2?P.a:P.b,.07);ctx.beginPath();
      for(let x=0;x<=W;x+=30){const y=y0+Math.sin(x*.006+t*.5+i)*60;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}}
  const vg=ctx.createRadialGradient(540,960,500,540,960,1250);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

/* ---------- HOOK (first 1.5 s: big text, readable on frame 0) ---------- */
const BOOKS=[];{const r=rng(42);for(let row=0;row<5;row++){let x=90;const base=560+row*190;
  while(true){const w=20+r()*30;if(x+w>990)break;BOOKS.push({x,base,w,h:105+r()*60,s:r(),d:r(),row});x+=w+3+(r()<.08?16:0);}}}
function shelves(a,drop=0,t=0,col=P.dim){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;
  for(let row=0;row<5;row++){ctx.fillStyle=rgba(col,.5*(1-drop));ctx.fillRect(80,560+row*190,920,8);}
  for(const b of BOOKS){const st=b.d*.6,p=clamp((drop-st)/.4);
    if(p<1){ctx.save();ctx.globalAlpha*=(1-p);ctx.fillStyle=mixHex(P.bg1,b.s<.5?P.a:P.b,.25+.35*b.s);ctx.fillRect(b.x,b.base-b.h-p*40,b.w,b.h);
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x+3,b.base-b.h-p*40+12,b.w-6,3);ctx.restore();}
    if(p>0)text(String(Math.floor(b.s*90+10)%10),b.x+b.w/2,b.base-b.h/2-eo(p)*240,{size:30,family:MONO,color:P.a,alpha:Math.sin(p*Math.PI),glow:12});}
  ctx.restore();}
function hookText(lines,y0,size,u,cols){setFont(size,800);const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));if(mw>960)size=Math.floor(size*960/mw);const lh=size*1.12;lines.forEach((l,i)=>{const y=y0+(i-(lines.length-1)/2)*lh;
  const c=cols&&cols[i];if(c==='grad')gradText(l,540,y,size,P.a,P.b,1,30);else text(l,540,y,{size,weight:800,color:c||P.txt,shadow:'rgba(0,0,0,.9)'});});}
function hook(u,t,o={}){
  const H_=CFG.hook,st=H_.style,lines=o.lines||H_.lines,sz=o.size||H_.size||104;
  if(st==='numbers'){ // word dissolving into digits
    const w='Париж',y=1000;setFont(110,800);const tw=ctx.measureText(w).width;let x=540-tw/2;
    for(let i=0;i<w.length;i++){const cw=ctx.measureText(w[i]).width,sw=hash(i*7.3+3)<.35+.5*seg(u,.2,1.6)+.15*Math.sin(t);
      text(sw?String(Math.floor(hash(i+Math.floor(t*6))*10)):w[i],x+cw/2,y,{size:110,weight:800,family:sw?MONO:SANS,color:sw?P.a:P.dim,glow:sw?20:0,alpha:.9});x+=cw;}
    text('↓',540,1115,{size:60,color:P.b,alpha:.8});
    text('+0.12  −0.48  +0.91  −0.07',540,1215,{size:40,family:MONO,color:P.a,glow:10});
    hookText(lines,620,sz,u,H_.cols);}
  else if(st==='formula'){ // big gradient keyword, matrix ghost
    setFont(34,500,MONO);for(let r=0;r<9;r++)for(let c=0;c<5;c++)text(fmtNum(hash(r*11+c*3)*2-1),180+c*180,860+r*46,{size:30,family:MONO,color:P.dim,alpha:.25+.15*Math.sin(t*2+r+c)});
    text('[',80,1045,{size:420,weight:300,color:P.dim,alpha:.35});text(']',1000,1045,{size:420,weight:300,color:P.dim,alpha:.35});
    text(lines[0],540,560,{size:64,weight:700,color:P.txt,maxW:960});
    const k=1+.03*Math.sin(t*2.2);ctx.save();ctx.translate(540,720);ctx.scale(k,k);gradText(lines[1],0,0,sz,P.a,P.b,1,40);ctx.restore();}
  else if(st==='question'){ // Париж vs трактор
    const ph=Math.sin(t*3);
    chip('Париж',290,1000,P.a,1,{size:80});chip('трактор',780,1000,P.hot,1,{size:80});
    text('или',535,1000,{size:50,weight:600,color:P.dim});
    text('?',540,1190,{size:150,weight:800,color:P.b,glow:40,alpha:.85+.15*ph});
    text('«Столица Франции — …»',540,830,{size:52,weight:600,color:P.dim});
    hookText(lines,520,sz,u,H_.cols);}
  else if(st==='library'){shelves(.55,0,t);ctx.fillStyle=rgba(P.bg0,.55);ctx.fillRect(0,0,W,H);
    ctx.save();ctx.strokeStyle=P.hot;ctx.lineWidth=26;ctx.lineCap='round';ctx.globalAlpha=.85;ctx.shadowColor=P.hot;ctx.shadowBlur=30;
    ctx.beginPath();ctx.moveTo(250,600);ctx.lineTo(830,1180);ctx.moveTo(830,600);ctx.lineTo(250,1180);ctx.stroke();ctx.restore();
    hookText(lines,880,sz,u,H_.cols);}
  else if(st==='chalk'){ // punchline first
    const eq=['x² − 5x + 6 = 0','y = kx + b','P(слово | текст)','a·b = Σ aᵢbᵢ'];
    eq.forEach((e,i)=>text(e,[300,780,330,760][i],[330,420,1150,1240][i],{size:46,family:MONO,color:P.dim,alpha:.55,shadow:''}));
    hookText(lines,760,sz,u,H_.cols);
    text('↓',540,1060+10*Math.sin(t*5),{size:110,weight:800,color:P.a,glow:30});}
  else if(st==='chat'){ // question bubble -> numbers
    setFont(54,600);const q='Столица Франции?',qw=ctx.measureText(q).width;
    ctx.save();rrect(980-qw-70,800,qw+70,120,46);ctx.fillStyle=rgba(P.b,.28);ctx.fill();ctx.strokeStyle=rgba(P.b,.8);ctx.lineWidth=3;ctx.stroke();ctx.restore();
    text(q,980-qw/2-35,862,{size:54,weight:600});
    for(let r=0;r<4;r++)text([fmtNum(.31),fmtNum(-.82),fmtNum(.05),fmtNum(.67)][r]+'  '+fmtNum(hash(r+Math.floor(t*4))*2-1)+'  '+fmtNum(hash(r*3+9)*2-1),540,1010+r*72,
      {size:42,family:MONO,color:P.a,alpha:.9-.15*r,glow:12});
    hookText(lines,560,sz,u,H_.cols);}
  else if(st==='search'){ // search bar crossed out
    setFont(46,500);ctx.save();rrect(110,1000,860,120,60);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fill();ctx.strokeStyle=rgba(P.dim,.6);ctx.lineWidth=3;ctx.stroke();ctx.restore();
    text('🔍',175,1062,{size:46,family:EMO,shadow:''});text('ищем готовый ответ…',235,1062,{size:46,align:'left',color:P.dim});
    ctx.save();ctx.strokeStyle=P.hot;ctx.lineWidth=12;ctx.lineCap='round';ctx.shadowColor=P.hot;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(150,1062);ctx.lineTo(930,1062);ctx.stroke();ctx.restore();
    text('0.94 · 0.03 · 0.0001',540,1220,{size:52,family:MONO,color:P.a,glow:16});
    hookText(lines,620,sz,u,H_.cols);}
  else if(st==='equation'){ // y = f(x)
    gradText('y = f(x)',540,1020,190,P.dim,P.a,.35+.08*Math.sin(t*2),30);
    text('ваш вопрос → x      ответ → y',540,1200,{size:42,family:MONO,color:P.dim});
    hookText(lines,620,sz,u,H_.cols);}
}

/* ---------- MYTH ---------- */
function myth(u,d,t){
  const drop=seg(u,d*.4,d*.62);
  zoomed(860,()=>{if(CFG.myth==='cards'){for(let i=0;i<12;i++){const c=i%3,r=Math.floor(i/3),x=200+c*340,y=560+r*200,p=clamp((drop-hash(i)*.5)/.5);
        ctx.save();ctx.globalAlpha*=(1-p)*(1-seg(u,d*.56,d*.64));rrect(x-140,y-75,280,150,22);ctx.fillStyle=rgba(P.b,.15);ctx.fill();ctx.strokeStyle=rgba(P.b,.6);ctx.lineWidth=2;ctx.stroke();ctx.restore();
        text('Ответ №'+(i*137+12),x,y-18,{size:32,weight:700,alpha:1-p});text('готовый текст',x,y+26,{size:26,color:P.dim,alpha:1-p});
        if(p>0)text(fmtNum(hash(i*3)*2-1),x,y-eo(p)*200,{size:40,family:MONO,color:P.a,glow:14,alpha:Math.sin(p*Math.PI)});}}
    else shelves(1-seg(u,d*.56,d*.64),drop,t);});
  cap(CFG.mythLine||'Кажется, внутри ChatGPT — огромная библиотека готовых ответов',300,env(u,0,d*.48,.35),{size:56});
  cap('Совсем не так.',290,seg(u,d*.48,d*.56),{size:84,weight:800,color:P.hot});
  const mm=seg(u,d*.58,d*.7);if(mm){for(let i=0;i<26;i++){const an=i*2.4+u*.3,r=180+hash(i*5)*260;text(fmtNum(hash(i*9+Math.floor(u*4))*2-1),540+Math.cos(an)*r,880+Math.sin(an)*r*1.1,{size:34,family:MONO,color:i%2?P.a:P.b,alpha:mm*.45});}
    text('В основе —',540,800,{size:72,weight:700,alpha:mm});gradText('математика',540,930,130,P.a,P.b,mm,40);}
}

/* ---------- TOKENS -> NUMBERS ---------- */
function tokens(u,d,t){
  const TOK=CFG.tokens||['Стол','ица',' Фран','ции',' —'];
  zoomed(800,()=>{setFont(66,700);const sp=ctx.measureText(' ').width,ws=TOK.map(s=>ctx.measureText(s.trim()).width),lead=TOK.map(s=>s.startsWith(' ')?sp:0);
    const total=ws.reduce((a,w,i)=>a+w+lead[i],0);let x=540-total/2;const c0=TOK.map((s,i)=>{x+=lead[i];const c=x+ws[i]/2;x+=ws[i];return c;});
    const gap=18,pad=36,tt=ws.reduce((a,w)=>a+w+pad,0)+gap*(TOK.length-1);x=540-tt/2;const c1=ws.map(w=>{const c=x+(w+pad)/2;x+=w+pad+gap;return c;});
    const k=eo(seg(u,.6,1.6)),y=590;
    TOK.forEach((s,i)=>{const cx=lerp(c0[i],c1[i],k),hue=i%2?P.b:P.a;
      if(k>0){ctx.save();ctx.globalAlpha*=k;rrect(cx-(ws[i]+pad)/2,y-52,ws[i]+pad,104,22);ctx.fillStyle=rgba(hue,.16);ctx.fill();ctx.strokeStyle=rgba(hue,.95);ctx.lineWidth=3;ctx.stroke();ctx.restore();}
      text(s.trim(),cx,y+2,{size:66,weight:700,color:k>.5?mixHex(P.txt,hue,.35):P.txt});
      for(let r=0;r<7;r++){const ap=d*.42+i*.22+r*.06,a=seg(u,ap,ap+.25);if(!a)continue;const settled=u>ap+.6;
        const v=settled?hash(i*31+r*7+CFG.seed)*2-1:hash(i*31+r*7+Math.floor(t*24))*2-1;
        text(fmtNum(v),c1[i],760+r*72,{size:34,family:MONO,color:settled?P.txt:hue,alpha:a*(settled?.92:.6)});}});
  });
  cap('Текст режется на кусочки — токены',330,env(u,0,d*.42,.3),{size:62});
  cap('Каждый кусочек → набор чисел',330,seg(u,d*.42,d*.5),{size:62,color:P.a});
  cap('в реальности — тысячи чисел на каждый токен',1330,seg(u,d*.62,d*.72),{size:40,weight:500,color:P.dim});
}

/* ---------- SPACE OF MEANINGS ---------- */
const EX={
  paris:{pts:[['Париж',[.45,.35,.1],'a'],['Франция',[.0,.0,.35],'b'],['Лондон',[.8,.65,-.3],'a'],['Рим',[.65,-.1,.6],'a'],['трактор',[-.85,-.7,-.5],'hot'],['комбайн',[-.55,-.95,-.05],'hot']],
    near:['Париж','Франция'],far:['Париж','трактор'],line:'«Париж» ближе к «Франции», чем «трактор»'},
  cities:{pts:[['Москва',[.15,.3,.1],'a'],['Петербург',[.6,.6,-.15],'a'],['Казань',[.3,-.15,.6],'a'],['Нью-Йорк',[-.85,-.55,-.45],'hot'],['Чикаго',[-.55,-.95,-.05],'hot']],
    near:['Москва','Петербург'],far:['Москва','Нью-Йорк'],line:'«Москва» ближе к «Петербургу», чем к «Нью-Йорку»'},
  cats:{pts:[['кот',[.1,.2,.1],'a'],['котёнок',[.55,.5,-.1],'a'],['кошка',[-.2,.7,.45],'a'],['банк',[-.8,-.6,-.4],'hot'],['кредит',[-.45,-.95,-.05],'hot']],
    near:['кот','котёнок'],far:['кот','банк'],line:'«кот» и «котёнок» — рядом, «банк» — далеко'}};
const DUST=[];{const r=rng(11);while(DUST.length<320){const p=[r()*2-1,r()*2-1,r()*2-1];if(p[0]**2+p[1]**2+p[2]**2<1)DUST.push({p:p.map(v=>v*1.2),s:r()});}}
function proj(p,ang,tilt,cx=540,cy=900,sc=400){const[x,y,z]=p,c=Math.cos(ang),s=Math.sin(ang),x1=x*c+z*s,z1=-x*s+z*c;
  const ct=Math.cos(tilt),st=Math.sin(tilt),y2=y*ct-z1*st,z2=y*st+z1*ct,f=3.2/(3.2+z2);return{x:cx+x1*sc*f,y:cy-y2*sc*f,f,z:z2};}
function space(u,d,t,p){
  const E=EX[p.ex],ang=u*.12-.25+(CFG.seed%3)*.12,tilt=.3,col=k=>P[k];
  zoomed(860,()=>{const da=seg(u,0,1);
    for(const q0 of DUST){const q=proj(q0.p,ang,tilt,540,860);ctx.fillStyle=rgba(P.dim,da*(.1+.25*q0.s)*q.f);ctx.fillRect(q.x,q.y,2.4*q.f,2.4*q.f);}
    const Q={};E.pts.forEach(([n,pp])=>Q[n]=proj(pp,ang,tilt,540,860));
    {const xs=Object.values(Q).map(q=>q.x),ys=Object.values(Q).map(q=>q.y),dx=540-(Math.min(...xs)+Math.max(...xs))/2,dy=860-(Math.min(...ys)+Math.max(...ys))/2;for(const q of Object.values(Q)){q.x+=dx;q.y+=dy;}}
    const ln=(A,B,c,a,dash)=>{const q=Q[A],r=Q[B];ctx.save();ctx.strokeStyle=rgba(c,a);ctx.lineWidth=4;if(dash)ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();ctx.restore();};
    const la=seg(u,d*.45,d*.6);if(la){ln(...E.near,P.a,.9*la);ln(...E.far,P.hot,.6*la,true);
      const m=(A,B)=>({x:(Q[A].x+Q[B].x)/2,y:(Q[A].y+Q[B].y)/2});const mn=m(...E.near),mf=m(...E.far);
      text('близко',mn.x+70,mn.y-30,{size:36,weight:700,color:P.a,alpha:la});text('далеко',mf.x,mf.y+40,{size:36,weight:700,color:P.hot,alpha:la});}
    E.pts.forEach(([n,pp,k],i)=>{const q=Q[n],a=seg(u,.3+i*.15,.8+i*.15);if(!a)return;const c=col(k);
      glowDot(q.x,q.y,34*q.f,c,.6*a);ctx.fillStyle=c;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(q.x,q.y,9*q.f,0,7);ctx.fill();ctx.globalAlpha=1;
      text(n,q.x,q.y-44*q.f,{size:44*q.f,weight:700,color:mixHex(P.txt,c,.3),alpha:a});});});
  cap('Слова — это точки в пространстве смыслов',300,env(u,0,d*.45,.3),{size:58});
  cap(E.line,300,seg(u,d*.45,d*.55),{size:54,color:P.txt});
  cap('(здесь 3 измерения, в реальности — тысячи)',1380,seg(u,.8,1.4),{size:38,weight:500,color:P.dim});
}

/* ---------- PROBABILITY: Париж vs трактор ---------- */
function prob(u,d,t){
  const g=eo(seg(u,d*.3,d*.55));
  text('«Столица Франции — …»',540,520,{size:68,weight:800,alpha:seg(u,0,.3)});
  zoomed(900,()=>{const items=[['Париж',.94,'0.94',P.a],['Лондон',.03,'0.03',P.b],['трактор',.0001,'0.0001',P.hot]];
    if(CFG.probStyle==='v'){items.forEach(([n,p,s,c],k)=>{const x=260+k*280,base=1150,h=480*Math.max(.012,p*g);
        ctx.save();ctx.globalAlpha*=seg(u,.2,.6);rrect(x-80,base-480,160,480,24);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
        rrect(x-80,base-h,160,h,24);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=24;ctx.fill();ctx.restore();
        text(s,x,base-h-44,{size:40,family:MONO,alpha:g});text(n,x,base+56,{size:44,weight:700,color:c,alpha:seg(u,.2,.6)});});}
    else items.forEach(([n,p,s,c],k)=>{const y=760+k*150;text(n,110,y,{size:52,weight:800,align:'left',color:c,alpha:seg(u,.2,.6)});
      ctx.save();ctx.globalAlpha*=seg(u,.2,.6);rrect(400,y-28,560,56,28);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill();
      rrect(400,y-28,Math.max(8,560*p*g),56,28);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=22;ctx.fill();ctx.restore();
      text(s,960,y+62,{size:36,family:MONO,align:'right',alpha:g});});});
  const w=seg(u,d*.6,d*.7);
  if(w){ctx.save();ctx.globalAlpha=w;rrect(120,1300,840,120,60);ctx.fillStyle=rgba(P.a,.18);ctx.fill();ctx.strokeStyle=P.a;ctx.lineWidth=4;ctx.stroke();ctx.restore();
    text('«Столица Франции — Париж»',540,1361,{size:46,weight:800,color:P.txt,alpha:w});}
  cap('Модель считает, какое слово вероятнее следующим',330,seg(u,.4,.8),{size:50,weight:600,color:P.dim});
}

/* ---------- TRAINING: guess, miss, adjust ---------- */
const WRONG=['тракторе','алгебре','облаке','вторнике','проводе','луне'];
function train(u,d,t){
  const prog=seg(u,.8,d-.6),k=Math.max(0,(u-.8)*3),kf=Math.floor(k),fr=k-kf,ok=hash(kf*3.7+1)<Math.pow(prog,1.2)*1.15;
  zoomed(820,()=>{text('Кошка спит на …',540,560,{size:64,weight:700,alpha:seg(u,.1,.5)});
    if(u>.8){const word=ok?'диване':WRONG[Math.floor(hash(kf*9.1)*WRONG.length)],c=ok?P.ok:P.hot,pop=1+.15*(1-eo(clamp(fr*4)));
      ctx.save();ctx.translate(540,680);ctx.scale(pop,pop);text(word+(ok?'  ✓':'  ✗'),0,0,{size:76,weight:800,color:c,glow:24});ctx.restore();}
    const n=Math.max(1,Math.round(Math.pow(10,12*Math.pow(prog,1.3))));
    text('попытка № '+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '),540,800,{size:42,family:MONO,color:P.dim,alpha:seg(u,.8,1.2)});
    const bx=150,by=930,bw=780,bh=300;ctx.strokeStyle=rgba(P.dim,.5);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.stroke();
    text('ошибка',bx+10,by-28,{size:32,align:'left',color:P.dim});text('обучение →',bx+bw,by+bh+34,{size:32,align:'right',color:P.dim});
    ctx.beginPath();const N=200;for(let j=0;j<=N*prog;j++){const x=j/N,l=.9*Math.exp(-4*x)+.06+(hash(j*1.7)-.5)*.16*(1-x),px=bx+x*bw,py=by+bh-clamp(l)*bh;j?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.strokeStyle=P.a;ctx.lineWidth=5;ctx.shadowColor=P.a;ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;});
  cap('Как она этому научилась?',300,env(u,0,d*.3,.3),{size:64,weight:800});
  cap('Миллиарды раз угадывала следующее слово — и ошибалась',300,env(u,d*.3,d*.66,.3),{size:52});
  cap('Ошибка → числа внутри чуть-чуть подкручиваются. И снова.',300,seg(u,d*.66,d*.74),{size:50,color:P.a});
}

/* ---------- GENERATION token by token ---------- */
const STEPS=[[['Начните',.41],['Сначала',.22],['Трактор',.001]],[['с',.62],['со',.14],['именно',.09]],[['проблемы,',.38],['идеи',.21],['клиента',.19]],
 [['за',.44],['которую',.3],['и',.1]],[['решение',.58],['которую',.12],['ответ',.08]],[['которой',.71],['которого',.12],['чего',.07]],
 [['люди',.49],['клиенты',.28],['вам',.1]],[['готовы',.63],['будут',.17],['хотят',.1]],[['платить.',.72],['заплатить.',.16],['трактор',.0002]]];
function gen(u,d,t){
  const sd=(d-1.4)/STEPS.length,s0=.6;setFont(40,500);const q='Как построить успешную компанию?',qw=ctx.measureText(q).width;
  ctx.save();ctx.globalAlpha=seg(u,0,.3);rrect(1000-qw-60,420,qw+60,90,30);ctx.fillStyle=rgba(P.b,.25);ctx.fill();ctx.restore();
  text(q,1000-qw/2-30,465,{size:40,weight:500,alpha:seg(u,0,.3)});
  const done=STEPS.filter((s,i)=>u>s0+i*sd+.8*sd).map(s=>s[0][0]);setFont(56,700);const lines=wrap(done.join(' '),900);
  lines.forEach((l,i)=>text(l,90,620+i*72,{size:56,weight:700,align:'left'}));
  const s=Math.floor((u-s0)/sd);
  if(s>=0&&s<STEPS.length){const v=(u-s0)/sd-s,g=eo(clamp(v/.45)),win=v>.55;
    STEPS[s].forEach(([w,p],r)=>{const y=1010+r*110,isW=r===0,a=clamp(v/.1)*(win&&!isW?.35:1);
      text(w,110,y,{size:46,weight:800,align:'left',alpha:a,color:isW&&win?P.a:P.txt});
      ctx.save();ctx.globalAlpha*=a;rrect(450,y-26,460,52,26);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
      rrect(450,y-26,Math.max(8,460*p*g),52,26);ctx.fillStyle=isW?P.a:P.b;ctx.fill();ctx.restore();
      text(p<.01?p.toFixed(4):p.toFixed(2),930,y+44,{size:30,family:MONO,align:'right',alpha:a*g});});}
  cap('Ответа ещё не существует',300,env(u,0,d*.5,.3),{size:62,weight:800});
  cap('Он рождается прямо сейчас — слово за словом',300,seg(u,d*.5,d*.58),{size:54});
}

/* ---------- WORDS -> NUMBERS ---------- */
function w2n(u,d,t){
  const m=seg(u,d*.25,d*.7),A='Мы видим слова, идеи и смыслы';
  for(let r=0;r<16;r++)for(let c=0;c<7;c++){const x=120+c*140,y=420+r*64,a=m*.5*hash(r*7+c);if(a<.02)continue;
    text(fmtNum(hash(r*13+c*7+Math.floor(t*5))*2-1),x,y,{size:30,family:MONO,color:mixHex(P.a,P.b,hash(r+c)),alpha:a});}
  setFont(76,800);const ls=wrap(A,880);ls.forEach((l,li)=>{const lw=ctx.measureText(l).width,y=860+(li-(ls.length-1)/2)*96;let x=540-lw/2;
    for(let i=0;i<l.length;i++){setFont(76,800);const cw=ctx.measureText(l[i]).width,sw=hash(li*101+i*7.3)<m;
      if(l[i]!==' ')text(sw?String(Math.floor(hash(i+li*9+Math.floor(t*8))*10)):l[i],x+cw/2,y,{size:76,weight:800,family:sw?MONO:SANS,color:sw?P.a:P.txt,glow:sw?10:0});x+=cw;}});
  cap('А внутри — числа, векторы, матрицы и вероятности',1260,seg(u,d*.45,d*.6),{size:56,weight:800,color:P.txt});
}

/* ---------- PUNCHLINE / SHARE / LOOP ---------- */
function punch(u,d,t){glowDot(540,860,420,P.b,.25);
  text('softmax(QKᵀ/√d)·V',540,540,{size:44,family:MONO,color:P.dim,alpha:.5*seg(u,.2,.8)});
  const k=eo(seg(u,0,.6));ctx.save();ctx.translate(540,860);ctx.scale(.9+.1*k,.9+.1*k);
  text('А вы говорите —',0,-110,{size:76,weight:700,alpha:k});gradText('зачем вам алгебра )',0,30,96,P.a,P.b,k,36);ctx.restore();}
function share(u,d,t){
  const k=eo(seg(u,0,.5)),fly=seg(u,.3,1.5);ctx.save();ctx.translate(540+fly*40,620-fly*30);ctx.rotate(-.35);ctx.globalAlpha=k;
  ctx.fillStyle=P.a;ctx.shadowColor=P.a;ctx.shadowBlur=30;ctx.beginPath();ctx.moveTo(-90,10);ctx.lineTo(100,-70);ctx.lineTo(40,90);ctx.lineTo(10,30);ctx.closePath();ctx.fill();ctx.restore();
  cap(CFG.share,920,k,{size:72,weight:800,maxW:900});
}
function cta(a){if(a<=0)return;setFont(42,700);const s='Книга про ИИ-агентов — ссылка в профиле',w=ctx.measureText(s).width+120,y=1360;
  ctx.save();ctx.globalAlpha=a;rrect(540-w/2,y-48,w,96,48);ctx.fillStyle=rgba(P.bg0,.85);ctx.fill();ctx.strokeStyle=P.a;ctx.lineWidth=3;ctx.stroke();ctx.restore();
  text('📘',540-w/2+52,y+2,{size:44,family:EMO,alpha:a,shadow:''});text(s,540+26,y+2,{size:42,weight:700,alpha:a});}

const SC={myth,tokens,space,prob,train,gen,w2n,punch,share};
const TL=[];let acc=0;for(const s of CFG.scenes){TL.push({...s,s:acc,e:acc+s.d});acc+=s.d;}
const T_END=acc,XF=.28;
function render(t){
  bg(t);
  for(const s of TL){if(t<s.s||t>s.e)continue;const first=s.type==='hook',last=s===TL[TL.length-1];
    const a=(first?1:clamp((t-s.s)/XF))*(last?1:clamp((s.e-t)/XF));if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;const u=t-s.s;
    if(s.type==='hook')hook(u,t);else if(s.type==='loop'){hook(0,t);}else SC[s.type](u,s.d,t,s);ctx.restore();}
  cta(clamp((t-(T_END-2))/.25));
  wm();
}
/* channel label: top band (bottom 25 % is kept free of text for the Reels UI) */
function wm(){const label='t.me/eventstory_by';ctx.save();setFont(28,700);const tw=ctx.measureText(label).width,iw=36,pw=tw+iw+46,ph=56,x=540-pw/2,y=150;
  rrect(x,y,pw,ph,28);ctx.fillStyle='rgba(8,10,24,.5)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.stroke();
  const cx=x+22+iw/2,cy=y+ph/2;ctx.fillStyle='#2aabee';ctx.beginPath();ctx.arc(cx,cy,iw/2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-10,cy+1);ctx.lineTo(cx+9,cy-8);ctx.lineTo(cx+5,cy+9);ctx.lineTo(cx-1,cy+4);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+22+iw+12,cy+1);ctx.restore();}
window.renderCover=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;bg(1.2);hook(1.5,1.2,{lines:CFG.cover.lines,size:CFG.cover.size});wm();};
boot(render,T_END);
</script>
