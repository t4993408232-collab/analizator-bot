<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Где ИИ окупается</title>
<style>
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16}
  body.render canvas{height:auto;width:1080px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ===== AI-Reels common kit (paste verbatim into each video's <script>) ===== */
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SANS='Inter, "DejaVu Sans", sans-serif', MONO='"DejaVu Sans Mono", monospace', SERIF='"DejaVu Serif", Georgia, serif';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const env=(t,a,b,f=.5)=>clamp((t-a)/f)*clamp((b-t)/f);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixHex(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`;}
function setFont(size,weight=500,family=SANS){ctx.font=`${weight} ${size}px ${family}`;}
function wrap(s,maxW){const out=[];for(const para of String(s).split('\n')){const words=para.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){out.push(line);line=w;}else line=test;}
  out.push(line);}return out;}
/* text(s,x,y,{size,weight,color,alpha,align,family,maxW,lh,glow,shadow}) – multi-line centered vertically on y */
function text(s,x,y,o={}){
  const{size=48,weight=500,color='#fff',alpha=1,align='center',family=SANS,maxW=0,lh=1.25,glow=0,shadow='rgba(0,0,0,.8)'}=o;
  if(alpha<=.002)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';
  setFont(size,weight,family);ctx.shadowColor=glow?color:shadow;ctx.shadowBlur=glow||(shadow?16:0);
  const lines=maxW?wrap(s,maxW):String(s).split('\n');const off=(lines.length-1)*size*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y-off+i*size*lh));ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowDot(x,y,r,color,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
/* film grain / noise overlay, deterministic per frame */
const _grain=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;})();
function grain(t,alpha=.08,mode='overlay'){ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation=mode;
  const ox=Math.floor(hash(Math.floor(t*24))*256),oy=Math.floor(hash(Math.floor(t*24)+7)*256);
  ctx.translate(-ox,-oy);ctx.fillStyle=ctx.createPattern(_grain,'repeat');ctx.fillRect(0,0,W+256,H+256);ctx.restore();}
/* Channel watermark – call LAST in render(t), every frame. dark=true for light backgrounds */
function watermark(dark=false){
  const label='t.me/eventstory_by';ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  setFont(34,700);const tw=ctx.measureText(label).width,iw=46,pw=tw+iw+56,ph=68,x=540-pw/2,y=1812;
  rrect(x,y,pw,ph,34);ctx.fillStyle=dark?'rgba(255,255,255,.7)':'rgba(8,10,24,.55)';ctx.fill();
  ctx.strokeStyle=dark?'rgba(0,0,0,.25)':'rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.stroke();
  const cx=x+28+iw/2,cy=y+ph/2;ctx.fillStyle='#2aabee';ctx.beginPath();ctx.arc(cx,cy,iw/2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-13,cy+1);ctx.lineTo(cx+12,cy-10);ctx.lineTo(cx+7,cy+12);ctx.lineTo(cx-1,cy+5);ctx.closePath();ctx.fill();
  ctx.fillStyle=dark?'rgba(10,10,20,.9)':'rgba(255,255,255,.92)';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+28+iw+14,cy+1);ctx.restore();
}
/* boot(render, T_END): exposes window.render/T_END/ready; plays in real time unless ?render */
function boot(render,T_END){
  window.render=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;render(t);};
  window.T_END=T_END;const isRender=location.search.includes('render');if(isRender)document.body.classList.add('render');
  const fonts=['400 40px Inter','500 40px Inter','600 40px Inter','700 40px Inter','800 40px Inter','400 40px "DejaVu Sans Mono"','700 40px "DejaVu Sans Mono"','400 40px "DejaVu Serif"','700 40px "DejaVu Serif"'];
  window.ready=Promise.all(fonts.map(f=>document.fonts.load(f))).then(()=>{window.render(0);return true;});
  if(!isRender){let t0=null;cv.addEventListener('click',()=>t0=null);
    window.ready.then(()=>{const loop=ts=>{if(t0===null)t0=ts;window.render(((ts-t0)/1000)%T_END);requestAnimationFrame(loop);};requestAnimationFrame(loop);});}
}
/* ===== end kit ===== */

const T_END=78;
const C={cyan:'#5ee7ff',violet:'#a78bfa',pink:'#ff5c8a',green:'#6dffb0',amber:'#ffb86b',text:'#eef1ff',dim:'#8f97c7'};
const WARM0=62.5,WARM1=65;
const cap=(s,y,a,o={})=>text(s,540,y,{size:50,weight:600,maxW:940,alpha:a,color:C.text,...o});
function mix(a,b,t){return mixHex(a,b,clamp(t));}

/* ---------- background ---------- */
const P=[];{const r=rng(7);for(let i=0;i<240;i++)P.push({x:r()*W,y:r()*H,z:.3+r()*.7,ph:r()*6.28});}
function bg(t){
  const warm=ease(seg(t,WARM0,WARM1));
  const g=ctx.createRadialGradient(W/2,H*.48,40,W/2,H*.48,H*.85);
  g.addColorStop(0,mix('#0d1236','#2b1709',warm));g.addColorStop(1,mix('#03040a','#060302',warm));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const pc=mixHex('#9fb4ff',C.amber,warm);
  for(const p of P){
    const y=((p.y-t*14*p.z)%H+H)%H,x=p.x+Math.sin(t*.3+p.ph)*12;
    ctx.fillStyle=rgba(pc,.12+.3*p.z*(.6+.4*Math.sin(t*1.3+p.ph)));
    ctx.fillRect(x,y,1.2+2*p.z,1.2+2*p.z);
  }
}

/* ---------- small drawing helpers ---------- */
function icon(kind,x,y,s,col,a,rot=0){
  if(a<=.003)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.strokeStyle=col;ctx.fillStyle=rgba(col,.16);ctx.lineWidth=3/s;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.shadowColor=col;ctx.shadowBlur=10;
  if(kind==='mail'){rrect(-30,-20,60,40,6);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-28,-17);ctx.lineTo(0,4);ctx.lineTo(28,-17);ctx.stroke();}
  else if(kind==='talk'){rrect(-30,-24,60,38,12);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-14,14);ctx.lineTo(-20,26);ctx.lineTo(-2,14);ctx.stroke();
    ctx.fillStyle=col;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(k*12,-5,3.5,0,7);ctx.fill();}}
  else if(kind==='doc'){rrect(-22,-28,44,56,6);ctx.fill();ctx.stroke();ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(-12,-14+k*10);ctx.lineTo(k===3?4:12,-14+k*10);}ctx.stroke();}
  else if(kind==='book'){ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(-14,-24,-30,-20);ctx.lineTo(-30,20);ctx.quadraticCurveTo(-14,16,0,24);
    ctx.quadraticCurveTo(14,16,30,20);ctx.lineTo(30,-20);ctx.quadraticCurveTo(14,-24,0,-16);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,24);ctx.stroke();}
  else if(kind==='chart'){ctx.beginPath();ctx.moveTo(-30,-26);ctx.lineTo(-30,24);ctx.lineTo(30,24);ctx.stroke();
    [[-20,14],[-6,28],[8,20],[22,40]].forEach(([bx,h])=>{rrect(bx-5,22-h,10,h,2);ctx.fill();ctx.stroke();});}
  ctx.restore();
}
function avatar(x,y,r,col,a){
  if(a<=.003)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.fillStyle=rgba(col,.16);ctx.lineWidth=3;ctx.shadowColor=col;ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(x,y-r*.45,r*.42,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x,y+r*.75,r*.72,Math.PI,2*Math.PI);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function check(x,y,s,col,a){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor=col;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.42);ctx.stroke();ctx.restore();}
function coin(x,y,s,col,a){if(a<=.003)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=rgba(col,.35);ctx.beginPath();ctx.ellipse(0,6,30,10,0,0,7);ctx.fill();
  ctx.fillStyle=rgba(col,.22);ctx.strokeStyle=col;ctx.lineWidth=2.5/s;ctx.shadowColor=col;ctx.shadowBlur=12;
  ctx.beginPath();ctx.ellipse(0,0,30,10,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,18,5.5,0,0,7);ctx.strokeStyle=rgba(col,.6);ctx.stroke();ctx.restore();}
function line(x1,y1,x2,y2,col,w=2,a=1){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}

/* clock: slow = hand runs lap after lap (hours), fast = one short sweep (minutes) */
function clockW(cx,cy,u,slow,a){
  if(a<=.003)return;const r=50,col=slow?C.pink:C.green;
  ctx.save();ctx.globalAlpha*=a;
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=rgba(col,.08);ctx.fill();ctx.strokeStyle=rgba(col,.6);ctx.lineWidth=3;ctx.stroke();
  ctx.lineWidth=2;for(let k=0;k<12;k++){const an=k*Math.PI/6;ctx.beginPath();ctx.moveTo(cx+Math.cos(an)*(r-9),cy+Math.sin(an)*(r-9));ctx.lineTo(cx+Math.cos(an)*(r-4),cy+Math.sin(an)*(r-4));ctx.stroke();}
  let ang;
  if(slow){ang=u*4.2;const laps=Math.floor(ang/(2*Math.PI)),fr=ang/(2*Math.PI)-laps;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-12,-Math.PI/2,-Math.PI/2+fr*2*Math.PI);ctx.closePath();ctx.fillStyle=rgba(col,.28);ctx.fill();
    for(let k=0;k<Math.min(laps,12);k++){const an=-Math.PI/2+(k+.5)*.5;glowDot(cx+Math.cos(an)*(r+15),cy+Math.sin(an)*(r+15),12,col,.9);
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx+Math.cos(an)*(r+15),cy+Math.sin(an)*(r+15),4,0,7);ctx.fill();}
  }else{ang=.9*eo(seg(u,0,1.3));
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-12,-Math.PI/2,-Math.PI/2+ang);ctx.closePath();ctx.fillStyle=rgba(col,.35);ctx.fill();}
  const ha=-Math.PI/2+ang;ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ha)*(r-14),cy+Math.sin(ha)*(r-14));ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();ctx.restore();
  text(slow?'часы':'минуты',cx,cy+r+34,{size:30,weight:700,color:col,alpha:a,glow:10});
}
function panel(y0,after,a){
  if(a<=0)return;const col=after?C.green:C.pink,s=after?'С ИИ':'ДО';
  ctx.save();ctx.globalAlpha*=a;rrect(70,y0,940,470,30);ctx.fillStyle=rgba(col,.045);ctx.fill();ctx.strokeStyle=rgba(col,.36);ctx.lineWidth=2;ctx.stroke();
  setFont(32,800);const w=ctx.measureText(s).width+44;rrect(100,y0+24,w,52,26);ctx.fillStyle=rgba(col,.16);ctx.fill();ctx.strokeStyle=rgba(col,.8);ctx.lineWidth=2;ctx.stroke();ctx.restore();
  text(s,100+w/2,y0+51,{size:32,weight:800,color:col,alpha:a,glow:10});
}

/* ---------- S1: hook 0–5.2 ---------- */
function neonSign(x,y,on,a,col=C.violet){
  if(a<=.003)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);
  const c=mix('#3a3f66',col,on);
  glowDot(0,0,360,col,.22*on);
  rrect(-290,-80,580,160,30);ctx.fillStyle=rgba(c,.08+.06*on);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=4;ctx.shadowColor=col;ctx.shadowBlur=30*on;ctx.stroke();
  rrect(-270,-62,540,124,22);ctx.strokeStyle=rgba(c,.5);ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=mix('#4a4f78','#ffffff',on*.85);ctx.shadowColor=col;ctx.shadowBlur=36*on;setFont(70,800);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('МАРКЕТИНГ',0,4);
  ctx.restore();
}
function s1(t){
  const A=env(t,-1,5.3,.6);if(!A)return;ctx.save();ctx.globalAlpha=A;
  for(let k=0;k<30;k++){const s0=k*.17-.8,p=(t-s0)/1.5;if(p<=0||p>=1)continue;const side=k%2?1:-1,j=hash(k*1.7);
    const x0=540+side*(560+j*120),y0=1750-j*300,x2=540+side*(40+j*140),y2=1060,cx=540+side*520,cy=1250-j*200;
    const u=eo(p),m=1-u,x=m*m*x0+2*m*u*cx+u*u*x2,y=m*m*y0+2*m*u*cy+u*u*y2;
    coin(x,y,.75,k%3?C.cyan:C.violet,clamp(p*6)*clamp((1-p)*5)*(1-.6*seg(t,3.4,4.2)));}
  const fl=t<2.9?1:(hash(Math.floor(t*16))>seg(t,2.9,4)*.85?1:.12);
  const on=fl*(1-.85*seg(t,3.7,4.3))*(.92+.08*Math.sin(t*9));
  ctx.save();const k=.9+.1*eo(seg(t,0,.8));ctx.translate(540,1060);ctx.scale(k,k);neonSign(0,0,on,1);ctx.restore();
  const ha=eo(seg(t,0,.25));
  text('Самые большие деньги ИИ приносит',540,410,{size:62,weight:700,maxW:900,lh:1.18,alpha:ha});
  ctx.save();ctx.translate(540,590);const s=.92+.08*eo(seg(t,.2,1));ctx.scale(s,s);
  setFont(108,800);const gw=ctx.measureText('не в маркетинге').width,sc=Math.min(1,940/gw);ctx.scale(sc,sc);
  const gr=ctx.createLinearGradient(-gw/2,0,gw/2,0);gr.addColorStop(0,C.pink);gr.addColorStop(1,C.violet);
  ctx.globalAlpha*=ha;ctx.fillStyle=gr;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=C.pink;ctx.shadowBlur=34+10*Math.sin(t*2);ctx.fillText('не в маркетинге',0,0);ctx.restore();
  text('Тогда где?',540,1400,{size:58,weight:800,color:C.cyan,glow:18,alpha:env(t,2.6,5.6,.4)});
  ctx.restore();
}

/* ---------- S2: scales 5–14.4 ---------- */
const COINP=(()=>{const rows=[4,3,4,3,2],o=[];rows.forEach((n,r)=>{for(let i=0;i<n;i++)o.push({dx:(i-(n-1)/2)*42+(r%2?0:4),dy:r*15});});return o;})();
function s2(t){
  const A=env(t,4.9,14.4,.6);if(!A)return;ctx.save();ctx.globalAlpha=A;
  const px=540,py=680,L=330,ang=.2*ease(seg(t,6.2,9.6))+.012*Math.sin(t*1.4);
  const ca=Math.cos(ang),sa=Math.sin(ang),lx=px-L*ca,ly=py+L*sa,rx=px+L*ca,ry=py-L*sa;
  const g=seg(t,9.9,11.2);
  /* stand */
  ctx.save();ctx.strokeStyle=rgba('#9fb4ff',.45);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,1240);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px-120,1260);ctx.lineTo(px-60,1236);ctx.lineTo(px+60,1236);ctx.lineTo(px+120,1260);ctx.closePath();ctx.fillStyle=rgba('#9fb4ff',.12);ctx.fill();ctx.stroke();ctx.restore();
  /* bowls */
  const bowl=(x,y,col,glow)=>{ctx.save();ctx.strokeStyle=rgba(col,.55);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-125,y+200);ctx.moveTo(x,y);ctx.lineTo(x+125,y+200);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-140,y+200);ctx.quadraticCurveTo(x,y+300,x+140,y+200);ctx.closePath();ctx.fillStyle=rgba(col,.14+.12*glow);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.shadowColor=col;ctx.shadowBlur=16+20*glow;ctx.stroke();ctx.restore();};
  const rc=mix(C.cyan,C.green,g);
  glowDot(rx,ry+230,320,C.green,.28*g*(.85+.15*Math.sin(t*3)));
  /* coins (behind bowl front) */
  const n=COINP.length;
  for(let i=0;i<n;i++){const ti=5.6+i*(3.8/n),p=eo(seg(t,ti,ti+.5));if(p<=0)continue;const c=COINP[i];
    coin(lx+c.dx,lerp(470,ly+218-c.dy,p),.8,i%3?C.violet:C.cyan,clamp(p*4));}
  coin(rx-20,ry+218,.8,rc,1);coin(rx+24,ry+218,.8,rc,1);
  bowl(lx,ly,C.violet,0);bowl(rx,ry,rc,g);
  /* beam */
  ctx.save();const bg_=ctx.createLinearGradient(lx,0,rx,0);bg_.addColorStop(0,C.violet);bg_.addColorStop(1,rc);
  ctx.strokeStyle=bg_;ctx.lineWidth=7;ctx.lineCap='round';ctx.shadowColor=C.cyan;ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(rx,ry);ctx.stroke();ctx.restore();
  glowDot(px,py,40,C.cyan,.6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,9,0,7);ctx.fill();
  /* return sparks */
  for(let j=0;j<16;j++){const ph=(t*.45+hash(j*3.1))%1,x=rx+(hash(j*7.7)-.5)*240,y=ry+200-ph*330;
    glowDot(x,y,18,C.green,g*Math.sin(ph*Math.PI)*.9);}
  if(g>0){for(let j=0;j<3;j++){const ph=(t*.6+j/3)%1,y=ry+150-ph*170,x=rx+(j-1)*70,a=g*Math.sin(ph*Math.PI);
    ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=C.green;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=C.green;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(x-16,y+12);ctx.lineTo(x,y-6);ctx.lineTo(x+16,y+12);ctx.stroke();ctx.restore();}}
  /* labels */
  text('бюджеты',lx,380,{size:46,weight:800,color:C.violet,glow:16,alpha:seg(t,5.6,6.3)});
  text('отдача',rx,380,{size:46,weight:800,color:C.green,glow:18,alpha:g});
  text('продажи и маркетинг',lx,ly+345,{size:36,weight:700,maxW:330,lh:1.15,color:'#d9dcff',alpha:seg(t,5.4,6)});
  text('бэк-офис',rx,ry+345,{size:36,weight:700,color:mix('#d9dcff',C.green,g),alpha:seg(t,5.4,6)});
  cap('Больше половины бюджетов на генеративный ИИ — в продажи и маркетинг',1530,env(t,5.5,9.8,.45),{size:48});
  cap('А лучшую отдачу компании видят в бэк-офисе',1530,env(t,10,14.2,.45),{size:54,weight:800});
  text('по данным исследования MIT (2025)',540,1690,{size:32,weight:500,color:C.dim,alpha:env(t,5.6,14.2,.5)});
  ctx.restore();
}

/* ---------- building (S3, takeaway, ending) ---------- */
const FL=['почта и обращения','протоколы встреч','документы и договоры','база знаний','сводки и отчёты'];
