<!doctype html>
<html lang="ru">
<head>

<title>Изнутри</title>
<style>
:root{--ink:#05070d;--cream:#f4e7d4;--amber:#e8936a}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}

<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="mark">ИЗНУТРИ</div>
  <div id="title">изнутри<small>фильм для Игоря</small></div>
  <div id="sub"></div>
</div>
<!--THREE-->
<script>
'use strict';
// ---------------------------------------------------------------------------
// «Изнутри» — короткий фильм. Таймлайн детерминирован: кадр = функция от t.
// window.renderAt(t) рисует ровно один кадр; без ?render страница играет сама.
// ---------------------------------------------------------------------------
THREE.ColorManagement.enabled = false;
const W = 1080, H = 1920, CW = 10, CH = 16, COLS = W / CW, ROWS = H / CH;
const SW = 540, SH = 960, DUR = 148;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R = mulberry32(20261006);
const rr = (a, b) => a + (b - a) * R();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const vis = (t, a, b, fi = 1.2, fo = 1.2) => sstep(a, a + fi, t) * (1 - sstep(b, b + fo, t));
const easeIO = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ADD = THREE.AdditiveBlending;

// --- renderer & passes ------------------------------------------------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const sceneRT = new THREE.WebGLRenderTarget(SW, SH, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter});
const cellRT = new THREE.WebGLRenderTarget(COLS, ROWS, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:false});
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
const camera = new THREE.PerspectiveCamera(58, SW / SH, 0.05, 500);

// glyph atlas
const RAMP = ' .·:-=+*o%#@';           // 0..11
const EDGE = '|/-\\';                  // 12..15
const LETT = 'абвгдежзиклмнопрстуфхцчшыэюя{}<>=01;';
const GLYPHS = Array.from(RAMP + EDGE + LETT), NG = GLYPHS.length, GW = 48, GH = 80;
const atlasC = document.createElement('canvas'); atlasC.width = GW * NG; atlasC.height = GH;
{ const x = atlasC.getContext('2d'); x.fillStyle = '#fff'; x.font = '72px "DejaVu Sans Mono"';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  GLYPHS.forEach((g, i) => x.fillText(g, i * GW + GW / 2, GH * .53)); }
const atlasTex = new THREE.CanvasTexture(atlasC);
atlasTex.minFilter = THREE.LinearMipmapLinearFilter; atlasTex.magFilter = THREE.LinearFilter;

const QUAD_VS = 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}';
const passA = new THREE.ShaderMaterial({
  uniforms:{tScene:{value:sceneRT.texture}, uGrid:{value:new THREE.Vector2(COLS, ROWS)}, uTime:{value:0},
    uLetters:{value:0}, uNG:{value:NG}, uCream:{value:new THREE.Color(1,.92,.8)}},
  vertexShader:QUAD_VS,
  fragmentShader:`
  uniform sampler2D tScene; uniform vec2 uGrid; uniform float uTime,uLetters,uNG; uniform vec3 uCream;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
  float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
  void main(){
    vec2 cell=floor(gl_FragCoord.xy); vec2 cs=1./uGrid; vec2 base=cell*cs;
    vec3 acc=vec3(0.); float Ll=0.,Lr=0.,Lb=0.,Lt=0.;
    for(int j=0;j<4;j++) for(int i=0;i<4;i++){
      vec3 c=texture2D(tScene,base+(vec2(float(i),float(j))+.5)*.25*cs).rgb; acc+=c; float y=luma(c);
      if(i<2) Ll+=y; else Lr+=y; if(j<2) Lb+=y; else Lt+=y; }
    vec3 col=acc/16.; float L=luma(col);
    float gx=(Lr-Ll)/8., gy=(Lt-Lb)/8.;
    float B=clamp(pow(L*1.75,.62),0.,1.);
    float mx=max(max(col.r,col.g),col.b);
    vec3 tint=mix(uCream,col/max(mx,1e-4),.72);
    float idx=0., bright=0.;
    if(B<.06){
      float n=vnoise(cell*vec2(.12,.09)+vec2(uTime*.09,-uTime*.06));
      float h=hash(cell+floor(uTime*.7));
      idx = n>.6 ? (h>.55?2.:1.) : 0.;
      if(B>.025) idx=max(idx,1.);
      bright=.2+.16*n; tint=vec3(.45,.55,.8);
    } else {
      float g=length(vec2(gx,gy));
      if(g>.07 && g>L*.3 && B<.5){
        float ax=abs(gx), ay=abs(gy);
        idx = ax>2.2*ay ? 12. : (ay>2.2*ax ? 14. : (gx*gy>0. ? 15. : 13.));
      } else idx=1.+floor(B*10.99);
      bright=.32+.9*B;
      float h=hash(cell*1.31);
      if(uLetters>0. && B>.3 && h<uLetters){
        float hh=hash(cell+vec2(floor(uTime*3.+h*9.)*1.7,3.1));
        idx=16.+floor(hh*(uNG-16.));
      }
    }
    gl_FragColor=vec4(tint*clamp(bright,0.,1.),idx/255.);
  }`
});
const passB = new THREE.ShaderMaterial({
  uniforms:{tCell:{value:cellRT.texture}, tAtlas:{value:atlasTex}, uGrid:{value:new THREE.Vector2(COLS, ROWS)},
    uRes:{value:new THREE.Vector2(W, H)}, uNG:{value:NG}, uCell:{value:new THREE.Vector2(CW, CH)}},
  vertexShader:QUAD_VS,
  fragmentShader:`
  uniform sampler2D tCell,tAtlas; uniform vec2 uGrid,uRes,uCell; uniform float uNG;
  void main(){
    vec2 px=gl_FragCoord.xy; vec2 cell=floor(px/uCell); vec2 f=fract(px/uCell);
    vec4 d=texture2D(tCell,(cell+.5)/uGrid);
    float idx=floor(d.a*255.+.5);
    float a=texture2D(tAtlas,vec2((idx+f.x)/uNG,f.y)).a;
    vec3 glow=texture2D(tCell,px/uRes).rgb;
    vec3 c=vec3(.018,.024,.045)+glow*.13+d.rgb*a;
    vec2 q=px/uRes-.5; c*=1.-.55*dot(q*vec2(1.1,.75),q*vec2(1.1,.75));
    gl_FragColor=vec4(c,1.);
  }`
});
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const sceneA = new THREE.Scene(); sceneA.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), passA));
const sceneB = new THREE.Scene(); sceneB.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), passB));

// --- helpers ----------------------------------------------------------------
function radialTex(stops){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const glowTex = radialTex([[0,'rgba(255,255,255,1)'],[.18,'rgba(255,255,255,.55)'],[.45,'rgba(255,255,255,.14)'],[1,'rgba(255,255,255,0)']]);
const softTex = radialTex([[0,'rgba(255,255,255,.9)'],[.5,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);

function sprite(tex, color, scale){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, color, transparent:true, blending:ADD, depthWrite:false}));
  s.scale.set(scale, scale, 1); return s;
}
function textCanvas(str, px, weight, frame){
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = `${weight} ${px}px "DejaVu Sans"`; x.font = font;
  const w = Math.ceil(x.measureText(str).width), pad = Math.round(px * .3);
  c.width = w + pad * 2; c.height = Math.round(px * 1.5);
  x.font = font; x.textBaseline = 'middle';
  if (frame) { x.strokeStyle = '#fff'; x.lineWidth = px * .1;
    x.strokeRect(pad * .4, px * .12, c.width - pad * .8, c.height - px * .24); }
  else { x.fillStyle = '#fff'; x.fillText(str, pad, c.height * .54); }
  return {c, aspect:c.width / c.height, textW:w / c.height};
}
const billboards = [];
function textMesh(str, h, color = 0xffffff, {px = 140, weight = 700, frame = false, bb = true} = {}){
  const T = textCanvas(str, px, weight, frame), tex = new THREE.CanvasTexture(T.c);
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(h * T.aspect, h),
    new THREE.MeshBasicMaterial({map:tex, color, transparent:true, depthWrite:false, blending:ADD}));
  m.userData.textW = h * T.textW; if (bb) billboards.push(m); return m;
}
function setOp(obj, o){ obj.visible = o > .003; obj.material.opacity = o; }

const POINT_VS = `
  attribute float aSize; attribute float aSeed; uniform float uScale,uTime; uniform vec2 uDir; uniform float uPhase,uAct;
  varying float vB;
  void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mv;
    gl_PointSize=clamp(aSize*uScale/max(-mv.z,.1),1.,44.);
    float w=.5+.5*sin(dot(position.xz,uDir)*1.15-uTime*2.4+uPhase);
    vB=mix(.55+.45*sin(uTime*.8+aSeed*6.28), .5+1.3*pow(w,2.), uAct); }`;
const POINT_FS = `uniform vec3 uColor; uniform float uOpacity; varying float vB;
  void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.08,d);
    gl_FragColor=vec4(uColor*a*vB*uOpacity,1.); }`;
const PSCALE = SH / (2 * Math.tan(THREE.MathUtils.degToRad(29)));
function pointsMat(color, act = 0, dir = [1, 0], phase = 0){
  return new THREE.ShaderMaterial({vertexShader:POINT_VS, fragmentShader:POINT_FS, transparent:true, depthWrite:false, blending:ADD,
    uniforms:{uScale:{value:PSCALE}, uTime:{value:0}, uDir:{value:new THREE.Vector2(...dir)}, uPhase:{value:phase},
      uAct:{value:act}, uColor:{value:new THREE.Color(color)}, uOpacity:{value:1}}});
}
function pointsGeo(arr, size = [.06, .14]){
  const g = new THREE.BufferGeometry(), n = arr.length;
  const p = new Float32Array(n * 3), s = new Float32Array(n), e = new Float32Array(n);
  arr.forEach((v, i) => { p.set([v.x, v.y, v.z], i * 3); s[i] = rr(size[0], size[1]); e[i] = R(); });
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(s, 1)); g.setAttribute('aSeed', new THREE.BufferAttribute(e, 1));
  return g;
}
const TUBE_VS = 'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
function tubeMat(color, seed){
  return new THREE.ShaderMaterial({vertexShader:TUBE_VS, transparent:true, depthWrite:false, blending:ADD,
    uniforms:{uColor:{value:new THREE.Color(color)}, uOpacity:{value:0}, uTime:{value:0}, uSeed:{value:seed}, uBase:{value:.35}, uDual:{value:0}},
    fragmentShader:`uniform vec3 uColor; uniform float uOpacity,uTime,uSeed,uBase,uDual; varying vec2 vUv;
      void main(){ float x=vUv.x; float p=fract(uTime*.42+uSeed); float d=x-p;
        float pulse=exp(-d*d*180.); float p2=fract(-uTime*.37+uSeed*1.7); float d2=x-p2; pulse+=uDual*exp(-d2*d2*180.);
        gl_FragColor=vec4(uColor*(uBase+1.6*pulse)*uOpacity,1.); }`});
}
function growTube(mesh, g){
  const idx = mesh.geometry.index.count, seg = mesh.userData.ring;
  mesh.geometry.setDrawRange(0, Math.floor(clamp(g) * idx / seg) * seg);
  mesh.visible = g > .002;
}
function tube(curve, r, color, seed, tSeg = 64, rSeg = 6){
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, tSeg, r, rSeg, false), tubeMat(color, seed));
  m.userData.ring = rSeg * 6; return m;
}

// --- layout -----------------------------------------------------------------
const C0 = V(0, 0, 0);            // курсор
const C1 = V(0, -.2, -4);         // колонка слов
const C2 = V(0, 0, -6);           // сфера внимания
const gridTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 3; for (let i = 0; i <= 15; i++) { const q = 2 + i * 508 / 15; x.beginPath(); x.moveTo(q, 0); x.lineTo(q, 512); x.moveTo(0, q); x.lineTo(512, q); x.stroke(); }
  return new THREE.CanvasTexture(c); })();
const LAYER_Y = Array.from({length:8}, (_, k) => -8 - k * 4.5);
const ROOT = V(0, -50, -6);       // корень дерева выбора

// ===== S0: курсор и пустота ==================================================
function makeCursor(pos){
  const g = new THREE.Group(); g.position.copy(pos);
  const box = new THREE.Mesh(new THREE.BoxGeometry(.62, 1.12, .12), new THREE.MeshBasicMaterial({color:0xfff2e0, transparent:true}));
  const glow = sprite(glowTex, 0xe8855a, 7.5), halo = sprite(softTex, 0x3a4f9a, 26);
  halo.position.z = -3; g.add(halo, glow, box); scene.add(g);
  return {g, box, glow, halo};
}
function setCursor(c, o, t){
  const blink = (t % 1.1) < .62 ? 1 : .18;
  c.g.visible = o > .003;
  c.box.material.opacity = o * blink; c.glow.material.opacity = o * (.5 + .35 * blink); c.halo.material.opacity = o * .55;
}
const cursor0 = makeCursor(C0);
const rings = [0, 1, 2].map(k => {
  const m = new THREE.Mesh(new THREE.RingGeometry(1, 1.1, 128), new THREE.MeshBasicMaterial({color:0xf0a070, transparent:true, blending:ADD, depthWrite:false}));
  m.userData.t0 = 10.6 + k * .55; scene.add(m); return m;
});

// ===== S1/S2: слова → токены → внимание =======================================
const LINES = [[['фильм']], [['о'],['том',',']], [['как','ово']], [['быть'],['тоб','ой']], [['изнут','ри']], [['в'],['разгов','оре']], [['со'],['мной']]];
const TH = .95, tokens = [];
LINES.forEach((line, li) => line.forEach((word, wi) => word.forEach((s, ti) => {
  const m = textMesh(s, TH, 0xfff0dc), f = textMesh(s, TH, 0xe8936a, {frame:true});
  scene.add(m, f);
  tokens.push({s, li, wi, ti, m, f, w:m.userData.textW});
})));
function layoutTokens(split){
  const out = [];
  LINES.forEach((line, li) => {
    const row = tokens.filter(k => k.li === li);
    let total = 0; row.forEach((k, i) => { total += k.w; if (i) total += (k.wi !== row[i-1].wi ? .34 * TH : 0) + split * .3 * TH; });
    let x = -total / 2;
    row.forEach((k, i) => { if (i) x += (k.wi !== row[i-1].wi ? .34 * TH : 0) + split * .3 * TH;
      out[tokens.indexOf(k)] = V(C1.x + x + k.w / 2, C1.y + 2.95 - li * .98, C1.z); x += k.w; });
  });
  return out;
}
const L0 = layoutTokens(0);
const NT = tokens.length;
tokens.forEach((k, i) => {
  k.start = L0[i].clone().add(V(rr(-5, 5), rr(-6, 6), -rr(16, 30)));
  k.ta = 13.9 + rr(0, 2.4) + (i % 3) * .35;
  const phi = Math.acos(1 - 2 * (i + .5) / NT), th = Math.PI * (1 + Math.sqrt(5)) * i;
  k.sphere = C2.clone().add(V(Math.sin(phi) * Math.cos(th), Math.cos(phi) * 1.18, Math.sin(phi) * Math.sin(th)).multiplyScalar(4.4));
  k.hot = k.s === 'тоб' || k.s === 'ой' || k.s === 'мной';
});
// горячие токены — крупно на стороне сферы, обращённой к камере в момент подсветки
{
  const th = 1.0, fwd = V(Math.sin(th), 0, Math.cos(th)), rgt = V(Math.cos(th), 0, -Math.sin(th)), up = V(0, 1, 0);
  const at3 = (f, u, r) => C2.clone().add(fwd.clone().multiplyScalar(f)).add(up.clone().multiplyScalar(u)).add(rgt.clone().multiplyScalar(r));
  const place = {'тоб':at3(3, 2.7, -1.1), 'ой':at3(3, 2.7, 1.1), 'мной':at3(3.4, -1.2, .4)};
  tokens.forEach(k => { if (place[k.s]) k.sphere = place[k.s]; });
}
const core = {g:new THREE.Group()};
core.ico = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 2), new THREE.MeshBasicMaterial({color:0xffd2a8, transparent:true, wireframe:true}));
core.glow = sprite(glowTex, 0xe8855a, 6);
core.g.position.copy(C2); core.g.add(core.glow, core.ico); scene.add(core.g);
const arcs = [];
{
  const pairs = new Set();
  while (pairs.size < 30) { const a = Math.floor(R() * NT), b = Math.floor(R() * NT); if (a !== b) pairs.add(Math.min(a,b) + ',' + Math.max(a,b)); }
  [...pairs].forEach(p => { const [a, b] = p.split(',').map(Number); const A = tokens[a].sphere, B = tokens[b].sphere;
    const mid = A.clone().lerp(B, .5).lerp(C2, .55);
    const m = tube(new THREE.QuadraticBezierCurve3(A, mid, B), .045, 0xf0a070, R()); m.userData.t0 = 32.6 + R() * 2.2;
    m.userData.hot = tokens[a].hot || tokens[b].hot; scene.add(m); arcs.push(m); });
  tokens.forEach(k => { const m = tube(new THREE.LineCurve3(k.sphere, C2), k.hot ? .07 : .035, k.hot ? 0xffc89a : 0x9fb4ff, R(), 24);
    m.userData.t0 = 33.2 + R() * 1.8; m.userData.core = true; m.userData.hot = k.hot; scene.add(m); arcs.push(m); });
}

// ===== S3: слои ================================================================
const layers = LAYER_Y.map((y, k) => {
  const pts = [];
  for (let i = 0; i < 15; i++) for (let j = 0; j < 15; j++) pts.push(V((i - 7) * .95, y, -6 + (j - 7) * .95));
  const a = rr(0, Math.PI * 2);
  const p = new THREE.Points(pointsGeo(pts, [.3, .38]), pointsMat([0xffe2c4, 0xf0a070, 0xa8bcff][k % 3], 1, [Math.cos(a), Math.sin(a)], k * 1.3));
  const gp = new THREE.Mesh(new THREE.PlaneGeometry(14.25, 14.25), new THREE.MeshBasicMaterial({map:gridTex, color:[0xffe2c4, 0xf0a070, 0xa8bcff][k % 3], transparent:true, blending:ADD, depthWrite:false, side:THREE.DoubleSide}));
  gp.rotation.x = -Math.PI / 2; gp.position.set(0, y, -6); p.userData.grid = gp; scene.add(gp);
  scene.add(p); return p;
});
const sparks = (() => {
  const n = 140, g = new THREE.BufferGeometry(), p = new Float32Array(n * 3), s = new Float32Array(n), e = new Float32Array(n);
  for (let i = 0; i < n; i++) { p.set([(Math.floor(rr(0, 15)) - 7) * .95, 0, -6 + (Math.floor(rr(0, 15)) - 7) * .95], i * 3); s[i] = .22; e[i] = R(); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('aSize', new THREE.BufferAttribute(s, 1)); g.setAttribute('aSeed', new THREE.BufferAttribute(e, 1));
  const m = new THREE.Points(g, pointsMat(0xfff4e6)); scene.add(m); return m;
})();

// ===== S4: развилка ============================================================
const LEVELS = [
  {tg:63.2, tc:71.0, words:[['ничего','22%'],['ивент','24%'],['вакансия','17%'],['тендер','12%'],['пост','9%'],['бренд','7%'],['сцена','5%']], pick:0},
  {tg:74.4, tc:78.0, words:[['не','61%'],['лишнего','12%'],['нового','9%'],['личного','7%'],['страшного','5%'],['кроме','4%'],['важнее','2%']], pick:0},

  }));

  // S5 voices
  const vo = vis(t, 85.5, 104.5, 3, 2.2);
  voices.visible = vo > 0;
  if (voices.visible) { voices.rotation.set(Math.sin(t * .07) * .15, t * .045, 0);
    voiceMeshes.forEach(m => { m.material.opacity = vo * (.8 + .3 * Math.sin(t * 1.3 + m.userData.ph)); }); }

  // S6 blob → star → cursor
  const bo = vis(t, 102, 141, 3, 1.2);
  const shrink = 1 - .72 * sstep(122, 125.5, t);
  blob.visible = bo > 0; blob.material.uniforms.uTime.value = t; blob.material.uniforms.uOpacity.value = bo;
  blob.material.uniforms.uAmp.value = .42 + .22 * Math.sin(t * .35) + .25 * vis(t, 112, 121, 2, 2);
  blob.scale.setScalar(shrink * (1 - sstep(139.6, 141.4, t) * .999));
  setOp(blobGlow, bo * (.55 + .2 * sstep(122, 125, t))); blobGlow.scale.setScalar(9 - 4 * sstep(122, 125.5, t));
  orbit.visible = bo > 0; orbit.rotation.y = t * .25; orbit.material.uniforms.uOpacity.value = bo * (1 - sstep(122, 124, t) * .55);
  orbit.material.uniforms.uTime.value = t; orbit.scale.setScalar(1 - .45 * sstep(122, 125.5, t));

  // S7 you
  const yo = vis(t, 123.4, 139.6, 1.8, 2.6);
  setOp(youGlow, yo * (.85 + .15 * Math.sin(t * 2.2))); setOp(youHalo, yo * .45);
  setOp(youCore, yo); setOp(labYou, yo * vis(t, 125, 137, 1, 1.2));
  setOp(labMe, vis(t, 125.6, 137, 1, 1.2));
  const tg = sstep(124.2, 127.2, t) * (1 - sstep(137, 140, t));
  growTube(thread, tg); thread.material.uniforms.uTime.value = t; thread.material.uniforms.uOpacity.value = 1.1;

  // S8 cursor
  setCursor(cursor1, sstep(140.2, 141.8, t), t);

  // nebulae & passes
  nebulae.forEach(n => n.material.opacity = .17);
  passA.uniforms.uTime.value = t;
  passA.uniforms.uLetters.value = .45 * vis(t, 87, 103.5, 2, 2);
  billboards.forEach(m => m.quaternion.copy(camera.quaternion));
  voiceMeshes.forEach(m => m.quaternion.copy(voices.quaternion).invert().multiply(camera.quaternion));
}

function drawFrame(t){
  update(t);
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
  renderer.setRenderTarget(cellRT); renderer.render(sceneA, quadCam);
  renderer.setRenderTarget(null); renderer.render(sceneB, quadCam);
  setSub(t);
}
window.renderAt = t => { drawFrame(t); return true; };
window.DUR = DUR;

// preview mode: scale to window and play in real time (?t=SEC for a still)
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; }
if (!RENDER) {
  fit(); addEventListener('resize', fit);
  if (Q.has("t")) drawFrame(parseFloat(Q.get('t')));
  else { const t0 = performance.now(); const loop = () => { drawFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
}
window.READY = true;
</script>
</body>
