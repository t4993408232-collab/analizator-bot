<script>
/* ===== AI-Reels common kit (paste verbatim into each video's <script>) ===== */
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SANS='Inter, "DejaVu Sans", sans-serif', MONO='"DejaVu Sans Mono", monospace', SERIF='"DejaVu Serif", Georgia, serif';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const env=(t,a,b,f=.5)=>clamp((t-a)/f)*clamp((b-t)/f);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixHex(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`;}
function setFont(size,weight=500,family=SANS){ctx.font=`${weight} ${size}px ${family}`;}
function wrap(s,maxW){const out=[];for(const para of String(s).split('\n')){const words=para.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){out.push(line);line=w;}else line=test;}
  out.push(line);}return out;}
/* text(s,x,y,{size,weight,color,alpha,align,family,maxW,lh,glow,shadow}) – multi-line centered vertically on y */
function text(s,x,y,o={}){
  const{size=48,weight=500,color='#fff',alpha=1,align='center',family=SANS,maxW=0,lh=1.25,glow=0,shadow='rgba(0,0,0,.8)'}=o;
  if(alpha<=.002)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';
  setFont(size,weight,family);ctx.shadowColor=glow?color:shadow;ctx.shadowBlur=glow||(shadow?16:0);
  const lines=maxW?wrap(s,maxW):String(s).split('\n');const off=(lines.length-1)*size*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y-off+i*size*lh));ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowDot(x,y,r,color,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
/* film grain / noise overlay, deterministic per frame */
const _grain=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;})();
function grain(t,alpha=.08,mode='overlay'){ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation=mode;
  const ox=Math.floor(hash(Math.floor(t*24))*256),oy=Math.floor(hash(Math.floor(t*24)+7)*256);
  ctx.translate(-ox,-oy);ctx.fillStyle=ctx.createPattern(_grain,'repeat');ctx.fillRect(0,0,W+256,H+256);ctx.restore();}
/* Channel watermark – call LAST in render(t), every frame. dark=true for light backgrounds */
function watermark(dark=false){
  const label='t.me/eventstory_by';ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  setFont(34,700);const tw=ctx.measureText(label).width,iw=46,pw=tw+iw+56,ph=68,x=540-pw/2,y=1812;
  rrect(x,y,pw,ph,34);ctx.fillStyle=dark?'rgba(255,255,255,.7)':'rgba(8,10,24,.55)';ctx.fill();
  ctx.strokeStyle=dark?'rgba(0,0,0,.25)':'rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.stroke();
  const cx=x+28+iw/2,cy=y+ph/2;ctx.fillStyle='#2aabee';ctx.beginPath();ctx.arc(cx,cy,iw/2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-13,cy+1);ctx.lineTo(cx+12,cy-10);ctx.lineTo(cx+7,cy+12);ctx.lineTo(cx-1,cy+5);ctx.closePath();ctx.fill();
  ctx.fillStyle=dark?'rgba(10,10,20,.9)':'rgba(255,255,255,.92)';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+28+iw+14,cy+1);ctx.restore();
}
/* boot(render, T_END): exposes window.render/T_END/ready; plays in real time unless ?render */
function boot(render,T_END){
  window.render=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;render(t);};
  window.T_END=T_END;const isRender=location.search.includes('render');if(isRender)document.body.classList.add('render');
  const fonts=['400 40px Inter','500 40px Inter','600 40px Inter','700 40px Inter','800 40px Inter','400 40px "DejaVu Sans Mono"','700 40px "DejaVu Sans Mono"','400 40px "DejaVu Serif"','700 40px "DejaVu Serif"'];
  window.ready=Promise.all(fonts.map(f=>document.fonts.load(f))).then(()=>{window.render(0);return true;});
  if(!isRender){let t0=null;cv.addEventListener('click',()=>t0=null);
    window.ready.then(()=>{const loop=ts=>{if(t0===null)t0=ts;window.render(((ts-t0)/1000)%T_END);requestAnimationFrame(loop);};requestAnimationFrame(loop);});}
}
/* ===== end kit ===== */

const T_END=55;
const RED='#c4161c', RED2='#e0262c', INK='#151515', PAPER='#dcdad4', AMBER='#ffb54a';
const fr=t=>Math.floor(t*24);

  {s:'а самое правдоподобное продолжение.',t0:22.3,t1:31.7,y:368,size:50,red:'правдоподобное'},
  {s:'Это уже случалось в суде.',t0:33.5,t1:41.5,y:300,size:60},

const CAP_CPS=38;
const typedN=(s,t0,cps,t)=>Math.max(0,Math.min(s.length,Math.floor((t-t0)*cps)));
const TICKS=[];
for(const L of PAPER_LINES){for(let i=0;i<L.s.length;i++)if(L.s[i]!==' ')TICKS.push({t:L.t0+(i+1)/L.cps,k:1});TICKS.push({t:L.t0+L.s.length/L.cps+0.05,k:2});}

for(const C of CAPS)if(!C.inst)for(let i=0;i<C.s.length;i++)if(C.s[i]!==' ')TICKS.push({t:C.t0+(i+1)/CAP_CPS,k:0});
window.TICKS=TICKS;

/* ---------- shared drawing ---------- */
function room(t,warm=0){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,mixHex('#141414','#1c140c',warm));g.addColorStop(.55,mixHex('#0b0b0b','#120c07',warm));g.addColorStop(1,'#040404');
  ctx.fillStyle=g;ctx.fillRect(-60,-60,W+120,H+120);
  // faint wall panelling
  ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=3;
  for(let x=-40;x<W+60;x+=180){ctx.beginPath();ctx.moveTo(x,-60);ctx.lineTo(x,H+60);ctx.stroke();}
}
function blinds(t,str=.5,ang=-.32,speed=38,period=150){
  if(str<=0)return;
  ctx.save();ctx.globalCompositeOperation='multiply';
  ctx.translate(540,960);ctx.rotate(ang);
  const off=((t*speed)%period+period)%period;
  for(let y=-1500;y<1500;y+=period){
    const y0=y+off, g=ctx.createLinearGradient(0,y0,0,y0+period);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.42,'rgba(255,255,255,1)');
    g.addColorStop(.52,`rgba(${255*(1-str)|0},${255*(1-str)|0},${255*(1-str)|0},1)`);
    g.addColorStop(.9,`rgba(${255*(1-str)|0},${255*(1-str)|0},${255*(1-str)|0},1)`);g.addColorStop(1,'rgba(255,255,255,1)');
    ctx.fillStyle=g;ctx.fillRect(-1400,y0,2800,period);
  }
  ctx.restore();
}
function lightPool(x,y,rx,ry,a,col='#ffffff'){
  ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,rgba(col,a));g.addColorStop(.6,rgba(col,a*.35));g.addColorStop(1,rgba(col,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rx,0,7);ctx.fill();ctx.restore();
}
/* hanging interrogation lamp; returns bulb position */
function lamp(t,cx,by,{sw=0,on=1,warm=0,cone=1,coneLen=900}={}){
  const lightC=mixHex('#f4f4f4',AMBER,warm);
  ctx.save();ctx.translate(cx,-40);ctx.rotate(sw);
  const L=by+40;
  // cone of light
  if(cone>0&&on>0){
    const g=ctx.createLinearGradient(0,L,0,L+coneLen);
    g.addColorStop(0,rgba(lightC,.34*on*cone));g.addColorStop(1,rgba(lightC,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-120,L);ctx.lineTo(120,L);ctx.lineTo(560,L+coneLen);ctx.lineTo(-560,L+coneLen);ctx.closePath();ctx.fill();
    // dust motes in the beam
    for(let i=0;i<34;i++){const r=hash(i*3.1),r2=hash(i*7.7);const yy=L+40+((r*coneLen*0.9+t*(18+r2*30))%(coneLen*.9));
      const spread=120+(yy-L)/coneLen*420;const xx=(hash(i*1.3)-.5)*2*spread*.85+Math.sin(t*.7+i)*14;
      ctx.fillStyle=rgba(lightC,(.25+.4*r2)*on*cone*(1-(yy-L)/coneLen));ctx.beginPath();ctx.arc(xx,yy,1.4+r*2.2,0,7);ctx.fill();}
  }

  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,L-150);ctx.stroke();
  // shade
  const sg=ctx.createLinearGradient(-160,0,160,0);
  sg.addColorStop(0,'#0e0e0e');sg.addColorStop(.32,'#4a4a4a');sg.addColorStop(.45,'#9a9a9a');sg.addColorStop(.6,'#3a3a3a');sg.addColorStop(1,'#0a0a0a');
  ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(-34,L-160);ctx.lineTo(34,L-160);ctx.lineTo(150,L-4);ctx.quadraticCurveTo(0,L+18,-150,L-4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#222';rrect(-40,L-182,80,30,8);ctx.fill();

  if(on>0){glowDot(0,L+4,260,lightC,.55*on);glowDot(0,L+4,90,'#ffffff',.9*on);
    ctx.fillStyle=rgba('#ffffff',on);ctx.beginPath();ctx.ellipse(0,L+2,70,14,0,0,7);ctx.fill();}
  ctx.restore();
}
function vignette(a=.85){
  const g=ctx.createRadialGradient(540,900,280,540,960,1250);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.65,`rgba(0,0,0,${a*.45})`);g.addColorStop(1,`rgba(0,0,0,${a})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function filmDamage(t){
  const f=fr(t);
  ctx.save();
  // flicker
  ctx.fillStyle=`rgba(0,0,0,${.05*hash(f*1.7)})`;ctx.fillRect(0,0,W,H);
  if(hash(f*5.3)>.86){ctx.fillStyle=`rgba(255,255,255,${.035*hash(f)})`;ctx.fillRect(0,0,W,H);}
  // scratches
  const ns=hash(f*2.9)>.55?(hash(f*4.1)>.8?2:1):0;
  for(let i=0;i<ns;i++){const x=hash(f*9.1+i*3)*W;ctx.strokeStyle=`rgba(230,230,230,${.10+.12*hash(f+i)})`;ctx.lineWidth=1+hash(f*3+i)*1.6;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+(hash(f+i*7)-.5)*30,H);ctx.stroke();}
  // dust & hairs
  const nd=Math.floor(hash(f*6.7)*5);
  for(let i=0;i<nd;i++){const x=hash(f*11+i)*W,y=hash(f*13+i*5)*H,r=1+hash(f*17+i)*3.5;
    ctx.fillStyle=hash(f+i*2)>.5?'rgba(0,0,0,.55)':'rgba(240,240,240,.35)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  if(hash(f*8.8)>.93){const x=hash(f*21)*W,y=hash(f*23)*H;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);
    ctx.bezierCurveTo(x+30,y-20,x+50,y+40,x+90,y+10);ctx.stroke();}
  ctx.restore();
}
/* caption: typewriter reveal, serif, with optional red word */
function caption(C,t){
  if(t<C.t0||t>C.t1+.35)return;
  const a=clamp((C.t1+.35-t)/.35)*(C.inst?clamp((t-C.t0)/.12+.0001):1);
  const n=C.inst?C.s.length:typedN(C.s,C.t0,CAP_CPS,t);
  ctx.save();ctx.globalAlpha=a;setFont(C.size,700,SERIF);
  const lines=wrap(C.s,W-140);const lh=C.size*1.22;let idx=0;
  let sc=1;if(C.inst){const p=seg(t,C.t0,C.t0+.22);sc=lerp(1.35,1,eo(p));}
  ctx.translate(540,C.y);ctx.scale(sc,sc);
  lines.forEach((ln,li)=>{
    const y=(li-(lines.length-1)/2)*lh;const full=ctx.measureText(ln).width;let x=-full/2;
    const words=ln.split(' ');
    words.forEach((w,wi)=>{
      const ws=(wi?' ':'')+w;
      for(const ch of ws){ if(idx>=n)break;
        const isRed=C.red&&w.replace(/[.,]/g,'')===C.red&&ch!==' ';
        ctx.fillStyle=isRed?RED2:(C.col||'#f2f2f2');ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=18;
        ctx.textAlign='left';ctx.textBaseline='middle';
        const jy=(hash(idx*3.7+C.t0)-.5)*2.2;ctx.fillText(ch,x,y+jy);x+=ctx.measureText(ch).width;idx++;}
      if(idx<n||true){}
    });
    idx+=0; // spaces between lines counted by wrap removal
    if(li<lines.length-1)idx++; // the space consumed by wrapping
  });
  // caret
  if(!C.inst&&n<C.s.length){}
  ctx.restore();
}

/* ---------- lazily built textures ---------- */
let TX=null;
function buildTex(){
  TX={};
  // rubber stamp
  {const c=document.createElement('canvas');c.width=900;c.height=240;const g=c.getContext('2d');
   g.strokeStyle=RED;g.fillStyle=RED;g.lineWidth=12;g.beginPath();g.roundRect(14,14,872,212,18);g.stroke();
   g.lineWidth=4;g.beginPath();g.roundRect(34,34,832,172,10);g.stroke();
   g.font=`800 86px ${SANS}`;g.textAlign='center';g.textBaseline='middle';
   {const tw=g.measureText('НЕ СУЩЕСТВУЕТ').width;g.save();g.translate(450,124);g.scale(Math.min(1,780/tw),1);g.fillText('НЕ СУЩЕСТВУЕТ',0,0);g.restore();}
   const r=rng(7);g.globalCompositeOperation='destination-out';
   for(let i=0;i<2600;i++){g.fillStyle=`rgba(0,0,0,${.3+r()*.7})`;g.beginPath();g.arc(r()*900,r()*240,r()*r()*5+.4,0,7);g.fill();}
   for(let i=0;i<14;i++){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(r()*900,r()*240,20+r()*70,4+r()*10,r()*3,0,7);g.fill();}
   TX.stamp=c;}
  // case folder
  {const c=document.createElement('canvas');c.width=700;c.height=470;const g=c.getContext('2d');
   g.fillStyle='#a9a59c';g.beginPath();g.moveTo(40,40);g.lineTo(240,40);g.lineTo(270,70);g.lineTo(680,70);g.lineTo(680,460);g.lineTo(20,460);g.lineTo(20,60);g.closePath();g.fill();
   g.fillStyle='#bdb9b0';g.fillRect(20,90,660,370);
   const r=rng(3);for(let i=0;i<3000;i++){g.fillStyle=`rgba(0,0,0,${r()*.06})`;g.fillRect(r()*700,r()*470,2,2);}
   g.fillStyle='#e4e2dc';g.fillRect(120,170,460,210);g.strokeStyle='#555';g.lineWidth=2;g.strokeRect(120,170,460,210);
   g.fillStyle=INK;g.font=`700 46px ${MONO}`;g.textAlign='center';g.textBaseline='middle';
   g.fillText('ДЕЛО №1',350,230);g.font=`700 52px ${MONO}`;g.fillText('НЕЙРОСЕТЬ',350,310);
   g.strokeStyle=INK;g.lineWidth=2;g.beginPath();g.moveTo(160,268);g.lineTo(540,268);g.stroke();
   g.save();g.translate(560,130);g.rotate(.18);g.strokeStyle=RED;g.lineWidth=5;g.strokeRect(-90,-28,180,56);g.fillStyle=RED;g.font=`800 34px ${SANS}`;g.fillText('СРОЧНО',0,2);g.restore();
   TX.folder=c;}
  // newspaper clipping
  {const w=880,h=980,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const r=rng(11);
   g.beginPath();const pts=[];const M=18;
   for(let x=M;x<=w-M;x+=22)pts.push([x,M+r()*14]);
   for(let y=M;y<=h-M;y+=22)pts.push([w-M-r()*14,y]);
   for(let x=w-M;x>=M;x-=22)pts.push([x,h-M-r()*14]);
   for(let y=h-M;y>=M;y-=22)pts.push([M+r()*14,y]);
   pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
   g.fillStyle='#d8d6cf';g.fill();g.save();g.clip();
   for(let i=0;i<9000;i++){g.fillStyle=`rgba(0,0,0,${r()*.07})`;g.fillRect(r()*w,r()*h,2,2);}
   const yg=g.createLinearGradient(0,0,w,h);yg.addColorStop(0,'rgba(0,0,0,0)');yg.addColorStop(1,'rgba(0,0,0,.18)');g.fillStyle=yg;g.fillRect(0,0,w,h);
   g.fillStyle=INK;g.textBaseline='middle';g.textAlign='left';
   g.font=`700 34px ${MONO}`;g.fillText('СУДЕБНАЯ ХРОНИКА',70,90);g.textAlign='right';g.fillText('США · 2023',w-70,90);
   g.fillRect(70,122,w-140,5);g.fillRect(70,133,w-140,2);
   g.textAlign='left';g.font=`700 64px ${SERIF}`;
   const HL=['Юрист принёс в суд','дела, придуманные','ChatGPT'];TX.hl=[];
   HL.forEach((s,i)=>{const y=212+i*82;g.fillText(s,70,y);TX.hl.push({y,w:g.measureText(s).width,s});});
   g.font=`700 64px ${SERIF}`;TX.hlX2=70+g.measureText('дела, ').width;
   g.fillRect(70,470,w-140,2);
   // halftone photo box
