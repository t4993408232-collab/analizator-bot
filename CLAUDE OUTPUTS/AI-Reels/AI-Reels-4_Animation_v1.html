<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Картинка из шума</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16}
  body.render canvas{height:auto;width:1080px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ===== AI-Reels common kit (paste verbatim into each video's <script>) ===== */
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SANS='Inter, "DejaVu Sans", sans-serif', MONO='"DejaVu Sans Mono", monospace', SERIF='"DejaVu Serif", Georgia, serif';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const env=(t,a,b,f=.5)=>clamp((t-a)/f)*clamp((b-t)/f);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixHex(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`;}
function setFont(size,weight=500,family=SANS){ctx.font=`${weight} ${size}px ${family}`;}
function wrap(s,maxW){const out=[];for(const para of String(s).split('\n')){const words=para.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){out.push(line);line=w;}else line=test;}
  out.push(line);}return out;}
/* text(s,x,y,{size,weight,color,alpha,align,family,maxW,lh,glow,shadow}) – multi-line centered vertically on y */
function text(s,x,y,o={}){
  const{size=48,weight=500,color='#fff',alpha=1,align='center',family=SANS,maxW=0,lh=1.25,glow=0,shadow='rgba(0,0,0,.8)'}=o;
  if(alpha<=.002)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';
  setFont(size,weight,family);ctx.shadowColor=glow?color:shadow;ctx.shadowBlur=glow||(shadow?16:0);
  const lines=maxW?wrap(s,maxW):String(s).split('\n');const off=(lines.length-1)*size*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y-off+i*size*lh));ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowDot(x,y,r,color,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
/* film grain / noise overlay, deterministic per frame */
const _grain=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=rng(99);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;})();
function grain(t,alpha=.08,mode='overlay'){ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation=mode;
  const ox=Math.floor(hash(Math.floor(t*24))*256),oy=Math.floor(hash(Math.floor(t*24)+7)*256);
  ctx.translate(-ox,-oy);ctx.fillStyle=ctx.createPattern(_grain,'repeat');ctx.fillRect(0,0,W+256,H+256);ctx.restore();}
/* Channel watermark – call LAST in render(t), every frame. dark=true for light backgrounds */
function watermark(dark=false){
  const label='t.me/eventstory_by';ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  setFont(34,700);const tw=ctx.measureText(label).width,iw=46,pw=tw+iw+56,ph=68,x=540-pw/2,y=1812;
  rrect(x,y,pw,ph,34);ctx.fillStyle=dark?'rgba(255,255,255,.7)':'rgba(8,10,24,.55)';ctx.fill();
  ctx.strokeStyle=dark?'rgba(0,0,0,.25)':'rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.stroke();
  const cx=x+28+iw/2,cy=y+ph/2;ctx.fillStyle='#2aabee';ctx.beginPath();ctx.arc(cx,cy,iw/2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-13,cy+1);ctx.lineTo(cx+12,cy-10);ctx.lineTo(cx+7,cy+12);ctx.lineTo(cx-1,cy+5);ctx.closePath();ctx.fill();
  ctx.fillStyle=dark?'rgba(10,10,20,.9)':'rgba(255,255,255,.92)';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+28+iw+14,cy+1);ctx.restore();
}
/* boot(render, T_END): exposes window.render/T_END/ready; plays in real time unless ?render */
function boot(render,T_END){
  window.render=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;render(t);};
  window.T_END=T_END;const isRender=location.search.includes('render');if(isRender)document.body.classList.add('render');
  const fonts=['400 40px Inter','500 40px Inter','600 40px Inter','700 40px Inter','800 40px Inter','400 40px "DejaVu Sans Mono"','700 40px "DejaVu Sans Mono"','400 40px "DejaVu Serif"','700 40px "DejaVu Serif"'];
  window.ready=Promise.all(fonts.map(f=>document.fonts.load(f))).then(()=>{window.render(0);return true;});
  if(!isRender){let t0=null;cv.addEventListener('click',()=>t0=null);
    window.ready.then(()=>{const loop=ts=>{if(t0===null)t0=ts;window.render(((ts-t0)/1000)%T_END);requestAnimationFrame(loop);};requestAnimationFrame(loop);});}
}
/* ===== end kit ===== */

const T_END=50;
const C={mag:'#ff2fa8',teal:'#22e6d2',amber:'#ffb347',violet:'#8a5cff',ink:'#06030d',cream:'#fff4e6'};
const CONF=['#ffd23f','#ff3fa4','#2ee6d6','#ffffff','#ff8a3d','#9b6bff'];
/* frame (image window) */
const FX=70,FY=420,FW=940,FH=1120,FR=40;
const IW=FW,IH=FH;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

/* ============ procedural scene A: festival stage ============ */
function paintFestival(g){
  const r=rng(41);
  let gr=g.createLinearGradient(0,0,0,IH);
  gr.addColorStop(0,'#07021a');gr.addColorStop(.35,'#25073f');gr.addColorStop(.62,'#3a0b46');gr.addColorStop(1,'#0a0414');
  g.fillStyle=gr;g.fillRect(0,0,IW,IH);
  const rg=(x,y,R,c,a)=>{const q=g.createRadialGradient(x,y,0,x,y,R);q.addColorStop(0,rgba(c,a));q.addColorStop(1,rgba(c,0));g.fillStyle=q;g.fillRect(x-R,y-R,2*R,2*R);};
  g.globalCompositeOperation='lighter';
  rg(470,470,560,'#c2187a',.55);rg(150,300,380,'#0aa6a0',.35);rg(800,330,380,'#ff8a3d',.32);rg(470,900,600,'#5a1a8a',.35);
  g.globalCompositeOperation='source-over';
  /* LED screen */
  const sx=190,sy=250,sw=560,sh=340;
  g.save();g.shadowColor='#ff4fa0';g.shadowBlur=90;
  gr=g.createLinearGradient(sx,0,sx+sw,0);gr.addColorStop(0,'#ff2f92');gr.addColorStop(.5,'#ffb347');gr.addColorStop(1,'#7b2cff');
  g.fillStyle=gr;g.fillRect(sx,sy,sw,sh);g.restore();
  g.save();g.beginPath();g.rect(sx,sy,sw,sh);g.clip();
  rg(470,430,260,'#fff3c4',.85);
  g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=3;
  for(let k=1;k<9;k++){g.beginPath();g.arc(470,560,k*42,0,7);g.stroke();}
  g.fillStyle='rgba(20,0,30,.22)';for(let x=sx;x<sx+sw;x+=12)g.fillRect(x,sy,3,sh);for(let y=sy;y<sy+sh;y+=12)g.fillRect(sx,y,sw,3);
  g.restore();
  /* truss */
  g.strokeStyle='#3a2c4c';g.lineWidth=6;
  g.beginPath();g.moveTo(0,100);g.lineTo(IW,100);g.moveTo(0,140);g.lineTo(IW,140);g.stroke();
  g.lineWidth=3;g.beginPath();for(let x=0;x<IW;x+=40){g.moveTo(x,100);g.lineTo(x+20,140);g.lineTo(x+40,100);}g.stroke();
  for(const tx of [40,860]){g.lineWidth=6;g.beginPath();g.moveTo(tx,100);g.lineTo(tx,680);g.moveTo(tx+40,100);g.lineTo(tx+40,680);g.stroke();
    g.lineWidth=3;g.beginPath();for(let y=100;y<680;y+=40){g.moveTo(tx,y);g.lineTo(tx+40,y+20);g.lineTo(tx,y+40);}g.stroke();}
  /* static beams */
  const fx=[150,290,420,520,650,790],bc=[C.teal,C.mag,C.amber,C.amber,C.mag,C.teal];
  g.globalCompositeOperation='lighter';
  fx.forEach((x,i)=>{const tx=x+(i<3?1:-1)*(120+60*(i%3)),ty=1120;const gg=g.createLinearGradient(x,140,tx,ty);
    gg.addColorStop(0,rgba(bc[i],.55));gg.addColorStop(1,rgba(bc[i],0));g.fillStyle=gg;
    g.beginPath();g.moveTo(x-6,145);g.lineTo(x+6,145);g.lineTo(tx+110,ty);g.lineTo(tx-110,ty);g.closePath();g.fill();});
  fx.forEach((x,i)=>{rg(x,146,60,bc[i],.9);rg(x,146,18,'#ffffff',1);});
  g.globalCompositeOperation='source-over';
  /* stage floor */
  g.fillStyle='#14071c';g.beginPath();g.moveTo(90,640);g.lineTo(850,640);g.lineTo(940,730);g.lineTo(0,730);g.closePath();g.fill();
  g.save();g.shadowColor=C.amber;g.shadowBlur=24;g.strokeStyle='#ffc46b';g.lineWidth=5;g.beginPath();g.moveTo(90,640);g.lineTo(850,640);g.stroke();g.restore();
  /* performer */
  g.save();g.fillStyle='#07020c';g.strokeStyle='rgba(255,210,235,.7)';g.lineWidth=2.5;
  g.beginPath();g.arc(470,478,22,0,7);g.fill();g.stroke();
  g.beginPath();g.moveTo(446,506);g.lineTo(494,506);g.lineTo(500,580);g.lineTo(490,640);g.lineTo(476,640);g.lineTo(470,590);g.lineTo(464,640);g.lineTo(450,640);g.lineTo(440,580);g.closePath();g.fill();g.stroke();
  g.lineCap='round';g.lineWidth=13;g.strokeStyle='#07020c';g.beginPath();g.moveTo(490,512);g.lineTo(530,470);g.lineTo(548,410);g.stroke();
  g.beginPath();g.moveTo(450,512);g.lineTo(432,560);g.lineTo(440,590);g.stroke();g.restore();
  /* confetti (far) */
  const conf=(n,smin,smax,y0,y1)=>{for(let i=0;i<n;i++){const x=r()*IW,y=y0+r()*(y1-y0),s=smin+r()*(smax-smin);g.save();g.translate(x,y);g.rotate(r()*6.28);
    g.fillStyle=CONF[Math.floor(r()*CONF.length)];g.globalAlpha=.65+r()*.35;g.fillRect(-s/2,-s*.3,s,s*.6*(.4+r()*.8));g.restore();}};
  conf(220,6,13,150,820);
  /* crowd */
  for(let row=0;row<7;row++){
    const y=740+row*58+row*row*3,hr=11+row*4.2,step=hr*2.7,dark=mixHex('#2a1238','#030006',row/6);
    for(let x=-20+r()*step;x<IW+20;x+=step*(.8+r()*.45)){
      const hy=y-r()*8;g.fillStyle=dark;
      if(r()<.33){const side=r()<.5?-1:1;g.save();g.strokeStyle=dark;g.lineCap='round';g.lineWidth=hr*.55;g.beginPath();g.moveTo(x+side*hr*.9,hy+hr*1.4);
        const ax=x+side*hr*(1.2+r()*.8),ay=hy-hr*(2.2+r()*1.4);g.quadraticCurveTo(x+side*hr*1.6,hy,ax,ay);g.stroke();g.beginPath();g.arc(ax,ay,hr*.38,0,7);g.fill();g.restore();}
      g.beginPath();g.ellipse(x,hy+hr*2.1,hr*1.45,hr*1.25,0,0,7);g.fill();
      g.beginPath();g.arc(x,hy,hr,0,7);g.fill();
      g.save();g.strokeStyle=rgba(r()<.5?C.teal:C.mag,.55-row*.05);g.lineWidth=2+row*.3;g.beginPath();g.arc(x,hy,hr,Math.PI*1.1,Math.PI*1.9);g.stroke();g.restore();
    }
  }
  conf(50,14,26,150,1080);
  g.globalCompositeOperation='lighter';
  for(let i=0;i<40;i++)rg(r()*IW,120+r()*600,6+r()*18,CONF[i%6],.7);
  g.globalCompositeOperation='source-over';
  const v=g.createRadialGradient(470,560,300,470,560,860);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,IW,IH);
}

/* ============ procedural scene B: night, mountains, lake, aurora ============ */
function paintNight(g){
  const r=rng(77),HZ=650;
  let gr=g.createLinearGradient(0,0,0,HZ);
  gr.addColorStop(0,'#020414');gr.addColorStop(.45,'#071a3a');gr.addColorStop(.85,'#0d3b52');gr.addColorStop(1,'#1d6274');
  g.fillStyle=gr;g.fillRect(0,0,IW,HZ);
  const rg=(x,y,R,c,a)=>{const q=g.createRadialGradient(x,y,0,x,y,R);q.addColorStop(0,rgba(c,a));q.addColorStop(1,rgba(c,0));g.fillStyle=q;g.fillRect(x-R,y-R,2*R,2*R);};
  g.globalCompositeOperation='lighter';
  /* milky way */
  g.save();g.translate(470,300);g.rotate(-.55);
  const mw=g.createRadialGradient(0,0,0,0,0,520);mw.addColorStop(0,'rgba(140,120,255,.28)');mw.addColorStop(1,'rgba(140,120,255,0)');
  g.scale(1,.22);g.fillStyle=mw;g.fillRect(-600,-600,1200,1200);g.restore();
  for(let i=0;i<900;i++){const u=(r()-.5)*1100,v=(r()+r()+r()-1.5)*70;const x=470+u*Math.cos(-.55)-v*Math.sin(-.55),y=300+u*Math.sin(-.55)+v*Math.cos(-.55);
    if(y>HZ)continue;g.fillStyle=`rgba(220,225,255,${.15+r()*.5})`;g.fillRect(x,y,1.4,1.4);}
  for(let i=0;i<520;i++){const x=r()*IW,y=r()*HZ*.95,s=.8+r()*r()*2.6;g.fillStyle=`rgba(255,255,255,${.25+r()*.75})`;g.beginPath();g.arc(x,y,s,0,7);g.fill();}
  /* aurora curtains */
  for(let k=0;k<4;k++){const base=230+k*55,col=k%2?'#7dff9e':'#2ef0c8';
    for(let x=0;x<IW;x+=3){const y=base+60*Math.sin(x*.006+k*1.7)+25*Math.sin(x*.017+k);const h=150+70*Math.sin(x*.011+k*2.3);
      const q=g.createLinearGradient(0,y,0,y-h);q.addColorStop(0,rgba(col,.10));q.addColorStop(.7,rgba(k==3?'#c46bff':col,.035));q.addColorStop(1,rgba(col,0));
      g.fillStyle=q;g.fillRect(x,y-h,3,h);}}
  /* moon */
  rg(730,170,220,'#bfe8ff',.32);
  g.globalCompositeOperation='source-over';
  g.fillStyle='#f4f1e6';g.beginPath();g.arc(730,170,44,0,7);g.fill();
  g.fillStyle='rgba(180,180,170,.35)';g.beginPath();g.arc(718,160,9,0,7);g.arc(744,184,6,0,7);g.fill();
  /* mountains */
  const ridge=(amp,base,col,seed,freq)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,HZ);
    for(let x=0;x<=IW;x+=6){const y=base-amp*(.55+.45*Math.sin(x*freq+seed))*(.6+.4*Math.sin(x*freq*2.7+seed*3))-14*hash(x*.1+seed);g.lineTo(x,y);}g.lineTo(IW,HZ);g.closePath();g.fill();};
  ridge(260,HZ,'#18405e',1.3,.007);ridge(190,HZ,'#0e2a46',4.1,.011);ridge(110,HZ,'#071830',2.2,.017);
  /* pines on shore */
  g.fillStyle='#030a16';
  for(let x=0;x<IW;x+=9+r()*12){if(x>300&&x<620&&r()<.85)continue;const h=30+r()*90;g.beginPath();g.moveTo(x,HZ-h);g.lineTo(x+h*.22,HZ);g.lineTo(x-h*.22,HZ);g.closePath();g.fill();}
  g.fillRect(0,HZ-4,IW,8);
  /* lake reflection */
  g.save();g.globalAlpha=.6;g.translate(0,HZ);g.scale(1,-(IH-HZ)/HZ*.95);g.drawImage(g.canvas,0,0,IW,HZ,0,-HZ,IW,HZ);g.restore();
  gr=g.createLinearGradient(0,HZ,0,IH);gr.addColorStop(0,'rgba(2,8,20,.15)');gr.addColorStop(1,'rgba(2,6,16,.85)');g.fillStyle=gr;g.fillRect(0,HZ,IW,IH-HZ);
  g.globalCompositeOperation='lighter';
  for(let i=0;i<140;i++){const y=HZ+10+r()*r()*(IH-HZ-20),w=10+r()*70*(1-(y-HZ)/600),x=730+(r()-.5)*(60+(y-HZ)*.3);g.fillStyle=`rgba(230,240,255,${.08+r()*.25})`;g.fillRect(x-w/2,y,w,2);}
  g.globalCompositeOperation='source-over';
  /* foreground rocks */
  g.fillStyle='#01040b';g.beginPath();g.moveTo(0,IH);g.lineTo(0,960);g.lineTo(90,930);g.lineTo(180,990);g.lineTo(260,1060);g.lineTo(330,IH);g.closePath();g.fill();
  g.beginPath();g.moveTo(IW,IH);g.lineTo(IW,1010);g.lineTo(840,1040);g.lineTo(770,IH);g.closePath();g.fill();
  const v=g.createRadialGradient(470,560,300,470,560,860);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,IW,IH);
}

/* blur pyramids: [sharp, mid, heavy] */
function pyramid(paint){const a=mk(IW,IH);paint(a.getContext('2d'));
  const b=mk(IW,IH),bg=b.getContext('2d');bg.filter='blur(14px)';bg.drawImage(a,0,0);
  const c=mk(IW,IH),cg=c.getContext('2d');cg.filter='blur(40px)';cg.drawImage(a,-40,-40,IW+80,IH+80);
  return[a,b,c];}
const SA=pyramid(paintFestival),SB=pyramid(paintNight);

/* diffusion noise (colored gaussian), half-res */
const NW=470,NH=560,NN=8;
const NOISE=[];{const r=rng(2024);for(let k=0;k<NN;k++){const c=mk(NW,NH),g=c.getContext('2d'),d=g.createImageData(NW,NH);
  for(let i=0;i<d.data.length;i+=4){for(let ch=0;ch<3;ch++){const v=128+((r()+r()+r()-1.5)*2)*95;d.data[i+ch]=v<0?0:v>255?255:v;}d.data[i+3]=255;}
  g.putImageData(d,0,0);NOISE.push(c);}}
/* TV static (gray), quarter-res */
const TV=[];{const r=rng(555);for(let k=0;k<8;k++){const c=mk(270,480),g=c.getContext('2d'),d=g.createImageData(270,480);
  for(let i=0;i<d.data.length;i+=4){const v=r()*r()<.02?255:Math.pow(r(),.8)*235;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);TV.push(c);}}
const SCAN=(()=>{const c=mk(4,4),g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,4,2);return c;})();
/* particle samples for finale */
const PW=60,PH=72;
function sample(src){const c=mk(PW,PH),g=c.getContext('2d');g.drawImage(src,0,0,PW,PH);return g.getImageData(0,0,PW,PH).data;}
const PA=sample(SA[0]),PB=sample(SB[0]);
const PHUE=['#ff2fa8','#22e6d2','#ffb347','#8a5cff','#ff6fb8','#3dffb8'].map(hex);

/* ============ timeline of the denoising process ============ */
const sn=s=>Math.sin(Math.PI/2*clamp(s/50));          /* noise weight for step s (0..50) */
const rn=s=>Math.pow(clamp((s-1)/49),1.15);
const nIdx=s=>(Math.floor(s)*5+3)%NN;
function proc(t){
  if(t<5)return{sc:SA,n:0,s:0,live:'A'};
  if(t<15){const s=50*seg(t,5,14);return{sc:SA,n:sn(s),s,live:'A',fwd:1};}
  if(t<35){const s=1+49*(1-seg(t,16.5,31.5));return{sc:SA,n:t>=31.5?0:rn(s),s,live:'A',rev:1};}
  if(t<36.3){const s=50*ease(seg(t,35,36.2));return{sc:SA,n:sn(s),s,live:'A'};}
  const s=1+49*(1-seg(t,37.3,41.3));return{sc:SB,n:t>=41.3?0:rn(s),s,live:'B',rev:1};
}

/* ============ drawing helpers ============ */
function inkBg(t,k=1){
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
