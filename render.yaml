# Render Blueprint для analizator-bot / Event HR Job Poster v3.0
# Создание: Render Dashboard → New → Blueprint → выбрать этот репозиторий.
# Render прочитает этот файл и поднимет сервис. Секреты (sync: false) задаются
# в дашборде при создании.
services:
  - type: web
    name: analizator-bot
    runtime: python
    plan: starter           # always-on: нужен, чтобы работал почасовой планировщик
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: data            # постоянный диск — чтобы антидубль переживал рестарты
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CHANNEL_ID
        value: "@event_hr"
      - key: SEEN_FILE
        value: /var/data/seen_vacancies.json
      - key: JOB_POSTER_ENABLED
        value: "1"
      - key: TENDER_AUTORUN
        value: "1"
      - key: TENDER_SEEN_FILE
        value: /var/data/seen_tenders.json
      - key: BOT_TOKEN       # секрет — задать в дашборде
        sync: false
      - key: OWNER_CHAT_ID   # секрет — задать в дашборде
        sync: false
      - key: OPENAI_API_KEY  # секрет — задать в дашборде
        sync: false
